<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de yardas</title>
<link rel="icon" href="../archivos/marca/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f3f5f8; --card: #fff; --ink: #0b1b33; --navy: #0d2347; --azul: #1d4f8f; --hielo: #5aaeff; --mut: #56647a; --linea: #e4e8ee;
  --pizarra: #0f2142; --trazo: rgba(150,200,255,.22); --trazo2: rgba(150,200,255,.42);
  --sombra: 0 1px 2px rgba(11,27,51,.05), 0 6px 18px rgba(11,27,51,.07);
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.35 Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: #e6eaf0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }

/* en la laptop: teléfono y notas; en el celular: pantalla completa y las notas abajo */
.mesa { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; gap: 36px; padding: 24px; }
.tel { width: 390px; height: 844px; border-radius: 46px; background: var(--bg); box-shadow: 0 0 0 10px #10151d, 0 30px 60px rgba(0,0,0,.25); position: relative; overflow: hidden; flex: none; }
.notas { width: 480px; font-size: 14px; color: #334; }
.notas h1 { font: 800 20px/1.2 Inter; margin: 4px 0 6px; }
.notas h2 { font: 700 12.5px/1 Inter; margin: 18px 0 8px; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.notas p { margin: 6px 0; }
.notas a { color: var(--azul); }
.notas ul { margin: 6px 0; padding-left: 18px; }
@media (max-width: 520px) {
  body { background: var(--bg); }
  .mesa { padding: 0; display: block; }
  .tel { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .notas { width: auto; padding: 18px 20px 40px; }
}

/* ---------- el teléfono ---------- */
.pant { position: absolute; inset: 0; display: flex; flex-direction: column; }
.mcab { background: linear-gradient(135deg, #0d2347 0%, #1d4f8f 70%, #2f6fbf 100%); color: #fff; padding: max(14px, env(safe-area-inset-top)) 18px 14px; border-radius: 0 0 24px 24px; flex: none; position: relative; z-index: 3; }
.mcab .fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mcab .marc { font: italic 900 40px/1 var(--disp); display: flex; align-items: center; gap: 10px; }
.mcab .marc img { width: 34px; height: 34px; object-fit: contain; }
.mcab .down { font: 700 12.5px/1.3 Inter; text-align: center; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.14); }
.conms { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.conm { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.14); border-radius: 11px; padding: 3px; }
.conm button { height: 32px; border-radius: 8px; font: 700 12px/1 Inter; color: rgba(255,255,255,.85); }
.conm button.on { background: #fff; color: var(--navy); }
.cuerpo { flex: 1; overflow-y: auto; padding: 0 20px 30px; }
.dictado { margin: 16px 0 0; background: #fff; border-radius: 14px; box-shadow: var(--sombra); padding: 12px 14px; font: 600 14px/1.35 Inter; }
.dictado b { font-weight: 800; }
.dictado small { display: block; color: var(--mut); font: 600 12px/1.2 Inter; margin-bottom: 2px; }
.pregunta { font: 800 21px/1.2 Inter; margin: 20px 2px 12px; }
.tiras { display: grid; gap: 8px; }
.tira { background: #fff; border-radius: 14px; box-shadow: var(--sombra); min-height: 56px; padding: 10px 16px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; column-gap: 14px; text-align: left; }
.tira svg { width: 22px; height: 22px; fill: none; stroke: var(--navy); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tira b { font: 700 16px/1.2 Inter; }
.tira small { color: var(--mut); font-size: 12.5px; }
.tira.td { background: linear-gradient(135deg, #0d2347 0%, #1d4f8f 55%, #5aaeff 100%); color: #fff; }
.tira.td svg { stroke: #fff; } .tira.td small { color: rgba(255,255,255,.85); }
.tira:active, .pj:active, .sinyd:active { transform: scale(.98); }
.ultima { margin-top: 14px; font-size: 13px; color: var(--mut); display: flex; gap: 8px; align-items: center; }
.ultima b { color: var(--ink); }
.ultima .t { margin-left: auto; font: 700 12px/1 Inter; color: var(--azul); flex: none; }

/* hojas: «¿Quién?» siempre desde abajo; «¿Cuánto?» desde abajo o desde arriba, sola */
.velo { position: absolute; inset: 0; background: rgba(8,16,32,.34); z-index: 8; }
.hoja { position: absolute; left: 0; right: 0; z-index: 9; background: #fff; padding: 10px 18px 18px; box-shadow: 0 -10px 30px rgba(0,0,0,.18); }
.hoja.abajo { bottom: 0; border-radius: 24px 24px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); animation: subir .22s cubic-bezier(.2,.8,.3,1); }
.hoja.arriba { top: 0; border-radius: 0 0 24px 24px; padding-top: calc(14px + env(safe-area-inset-top)); box-shadow: 0 10px 30px rgba(0,0,0,.18); animation: bajar .22s cubic-bezier(.2,.8,.3,1); }
.hoja.abajo::before { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #d6dce5; margin: 0 auto 10px; }
.hoja.arriba::after { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #d6dce5; margin: 12px auto 0; }
@keyframes subir { from { transform: translateY(100%); } }
@keyframes bajar { from { transform: translateY(-100%); } }
@media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
.hoja h3 { margin: 0; font: 800 19px/1.2 Inter; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hoja h3 small { font: 600 12.5px/1.2 Inter; color: var(--mut); text-align: right; }
.hoja p { margin: 4px 0 0; color: var(--mut); font-size: 13px; }
.pjs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.pj { display: grid; justify-items: center; gap: 6px; padding: 10px 2px 9px; border-radius: 14px; background: #f3f6f9; font: 600 12.5px/1.1 Inter; }
.pj .ini { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #e2eaf5; color: var(--navy); font: 800 14px/1 Inter; box-shadow: inset 0 0 0 2px #fff, 0 0 0 1.5px #c9d6e8; }
.cerrar { margin-top: 12px; width: 100%; height: 44px; border-radius: 14px; font: 700 14px/1 Inter; color: var(--mut); background: #f3f6f9; }
.sinyd { margin-top: 12px; width: 100%; height: 48px; border-radius: 14px; font: 700 15px/1 Inter; color: var(--navy); background: #eef2f8; }

/* A · pizarrón táctico: se pica dónde quedó el balón */
.piz { margin-top: 12px; height: 150px; border-radius: 16px; background: var(--pizarra); position: relative; overflow: hidden; cursor: crosshair; touch-action: manipulation; }
.piz .zona { position: absolute; top: 0; bottom: 0; background: rgba(90,174,255,.10); pointer-events: none; }
.piz .l { position: absolute; top: 12px; bottom: 24px; width: 1px; background: var(--trazo); pointer-events: none; }
.piz .l.d { background: var(--trazo2); }
.piz .h { position: absolute; width: 1px; height: 5px; background: var(--trazo); pointer-events: none; }
.piz .n { position: absolute; bottom: 7px; transform: translateX(-50%); font: 700 10.5px/1 Inter; color: rgba(170,210,255,.6); pointer-events: none; }
.piz .scrim { position: absolute; top: 8px; bottom: 20px; width: 2px; margin-left: -1px; background: var(--hielo); pointer-events: none; }
.piz .scrim i { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--hielo); }
.piz .ruta { position: absolute; top: 74px; height: 2px; background: linear-gradient(90deg, rgba(90,174,255,.2), var(--hielo)); pointer-events: none; }
.piz .punto { position: absolute; top: 75px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(90,174,255,.35); pointer-events: none; }
.piz .eti { position: absolute; top: 30px; transform: translateX(-50%); font: italic 900 24px/1 var(--disp); color: #fff; pointer-events: none; white-space: nowrap; }
.piz .eti small { font: 700 11px/1 Inter; font-style: normal; color: rgba(200,225,255,.8); margin-left: 3px; }
.piz .ayuda { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font: 600 12.5px/1 Inter; color: rgba(200,225,255,.75); pointer-events: none; }

/* B · regla limpia: se desliza y se guarda al soltar */
.rl { margin-top: 12px; border-radius: 16px; background: #f3f6f9; padding: 14px 0 12px; text-align: center; }
.rl .val { font: italic 900 44px/1 var(--disp); color: var(--ink); }
.rl .val small { font: 700 13px/1 Inter; color: var(--mut); font-style: normal; margin-left: 4px; }
.rl .val.vacio { color: #a3acb9; }
.rl .pista { font: 600 11.5px/1 Inter; color: var(--mut); margin-top: 5px; }
.regla-env { position: relative; margin-top: 10px; }
.regla { height: 54px; overflow-x: scroll; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent); touch-action: pan-x; }
.regla::-webkit-scrollbar { display: none; }
.pista-c { position: relative; height: 100%; }
.marcas { position: absolute; top: 4px; bottom: 4px; }
.marcas i { position: absolute; bottom: 14px; width: 1.5px; height: 12px; background: #c3ccd8; border-radius: 1px; }
.marcas i.c { height: 18px; background: #9aa7b8; }
.marcas i.d { height: 26px; background: var(--navy); }
.marcas span { position: absolute; bottom: 0; transform: translateX(-50%); font: 700 10.5px/1 Inter; color: var(--mut); }
.snap { position: absolute; top: 0; height: 100%; width: 1px; scroll-snap-align: center; }
.aguja { position: absolute; left: 50%; top: 0; height: 40px; width: 3px; margin-left: -1.5px; background: var(--hielo); border-radius: 2px; pointer-events: none; }

/* panel de resultados (en las notas) */
.tabla { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--sombra); font-size: 13px; }
.tabla th, .tabla td { padding: 8px 7px; text-align: right; border-top: 1px solid var(--linea); }
.tabla th { background: #f3f6f9; font: 700 10.5px/1.15 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
.tabla td:first-child, .tabla th:first-child { text-align: left; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.botones button { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--navy); color: #fff; font: 700 13px/1 Inter; }
.botones button.sec { background: #d9dfe8; color: var(--ink); }
.log { max-height: 220px; overflow-y: auto; background: #fff; border-radius: 12px; box-shadow: var(--sombra); font-size: 12.5px; }
.log div { display: flex; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--linea); }
.log div:first-child { border-top: 0; }
.log span:last-child:not(:first-child) { margin-left: auto; color: var(--mut); white-space: nowrap; }
.refs a { display: block; margin: 4px 0; }
</style>
</head>
<body>
<div class="mesa">
  <div class="tel" id="tel"></div>
  <div class="notas" id="notas"></div>
</div>
<script>
// Prueba de yardas, vuelta 2: primero «¿Quién?» y luego, sola, «¿Cuánto?».
// La jugada se guarda al escoger quién; las yardas se le agregan con un toque, o se saltan con «Sin yardas»
// (o tocando de una vez la siguiente jugada, si la hoja viene de arriba y la lista sigue a la vista).
const LOGO = '../archivos/marca/logo.webp', RIVAL = '../archivos/equipos/bucaneros-256.png?v=9';
const JUG = [['sr', 'Santiago', 'SR'], ['eo', 'Emiliano', 'EO'], ['mv', 'Mateo', 'MV'], ['rs', 'Rodrigo', 'RS'], ['me', 'Maximiliano', 'ME'], ['ic', 'Iván', 'IC'], ['lp', 'Leo', 'LP']];
const NOM = Object.fromEntries(JUG.map(([id, n]) => [id, n]));
// qué pasó: [clave, texto, pista, pregunta, ¿pregunta yardas?]; el TD calcula las suyas (hasta la zona de anotación)
const RES = [
  ['pase', 'Pase completo', 'Luego quién y cuánto', '¿Quién la atrapó?', true],
  ['corrida', 'Corrida', 'Luego quién y cuánto', '¿Quién corrió?', true],
  ['incompleto', 'Incompleto', 'Luego a quién iba', '¿A quién iba?', false],
  ['parada', 'Nos pararon', 'Luego a quién y cuánto', '¿A quién pararon?', true],
  ['td', 'Touchdown', 'Las yardas salen solas', '¿Quién anotó?', false],
];
const ICO = {
  pase: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', corrida: '<path d="M4 12h14M13 6l6 6-6 6"/>', incompleto: '<path d="M7 7l10 10M17 7 7 17"/>',
  parada: '<path d="M3.5 12H13M9.5 8.5 13 12l-3.5 3.5M18 5v14"/>', td: '<path d="M12 20v-7M6 13h12M6 13V4.5M18 13V4.5"/>',
};
const VARS = [['piz', 'Pizarrón'], ['regla', 'Regla']];
const HOJAS = [['abajo', 'Desde abajo'], ['arriba', 'Desde arriba']];
const DICTADO = [['pase', 'eo', 7], ['corrida', 'mv', 3], ['incompleto', 'rs', null], ['pase', 'me', 12], ['parada', 'mv', -2], ['corrida', 'ic', 5], ['pase', 'rs', 18], ['td', 'me', null]];
const CAMPO = 50, VENTANA = 40; // el pizarrón muestra 40 yardas alrededor de la línea
const MIN = -10, MAX = 50, PX = 12; // la regla: de -10 a +50

const leer = (k, d) => { try { const v = localStorage.getItem('yardas2.' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const poner = (k, v) => { try { localStorage.setItem('yardas2.' + k, JSON.stringify(v)); } catch { /* sin guardado, no pasa nada */ } };
// por omisión: pizarrón con la hoja desde arriba (lo escogió Iker); lo guardado antes se reinicia una vez
if (!leer('def2', false)) { poner('v', 'piz'); poner('h', 'arriba'); poner('def2', true); }
let st = { v: leer('v', 'piz'), h: leer('h', 'arriba'), nos: 0, down: 1, spot: 5, sel: null, paso: null, yd: null, t0: 0, toques: 0, dic: null, ultima: null, pend: null, log: leer('log', []) };
const $ = (s) => document.querySelector(s);
const fmt = (y) => (y == null ? '—' : (y > 0 ? '+' : '') + y);
let tGuardar;

// ---------- piezas ----------
// el pizarrón: 40 yardas desde 10 antes de la línea, sin salirse de la cancha
function ventana() { const a = Math.max(-10, Math.min(CAMPO + 10 - VENTANA, st.spot - 10)); return [a, a + VENTANA]; }
function pizarron() {
  const [a, b] = ventana(), x = (y) => ((y - a) / (b - a)) * 100;
  let h = '';
  if (a < 0) h += `<div class="zona" style="left:0;width:${x(0)}%"></div>`;
  if (b > CAMPO) h += `<div class="zona" style="left:${x(CAMPO)}%;right:0"></div>`;
  for (let y = Math.ceil(a / 5) * 5; y <= b; y += 5) {
    if (y < 0 || y > CAMPO) continue;
    h += `<div class="l${y % 10 === 0 ? ' d' : ''}" style="left:${x(y)}%"></div>`;
    if (y % 10 === 0 && y > 0 && y < CAMPO) h += `<span class="n" style="left:${x(y)}%">${y <= 25 ? y : CAMPO - y}</span>`;
  }
  for (let y = Math.ceil(a); y <= b; y++) if (y % 5 && y > 0 && y < CAMPO) h += `<i class="h" style="left:${x(y)}%;top:44px"></i><i class="h" style="left:${x(y)}%;top:104px"></i>`;
  h += `<div class="scrim" style="left:${x(st.spot)}%"><i></i></div>`;
  if (st.yd == null) h += '<div class="ayuda">Pica dónde quedó el balón</div>';
  else {
    const f = st.spot + st.yd;
    h += `<div class="ruta" style="left:${Math.min(x(st.spot), x(f))}%;width:${Math.abs(x(f) - x(st.spot))}%"></div><div class="punto" style="left:${x(f)}%"></div><div class="eti" style="left:${Math.max(12, Math.min(88, x(f)))}%">${fmt(st.yd)}<small>yd</small></div>`;
  }
  return `<div class="piz" id="piz">${h}</div>`;
}
function reglaHTML() {
  const ancho = (MAX - MIN) * PX, mitad = `((100% - ${ancho}px) / 2)`;
  let m = '', s = '';
  for (let y = MIN; y <= MAX; y++) {
    const xx = (y - MIN) * PX;
    m += `<i class="${y % 10 === 0 ? 'd' : y % 5 === 0 ? 'c' : ''}" style="left:${xx}px"></i>`;
    if (y % 10 === 0) m += `<span style="left:${xx}px">${y > 0 ? '+' + y : y}</span>`;
    s += `<div class="snap" style="left:calc(${mitad} + ${xx}px)"></div>`;
  }
  const val = `<div class="val num${st.yd == null ? ' vacio' : ''}" id="rval">${st.yd == null ? '0' : fmt(st.yd)}<small>yd</small></div>`;
  return `<div class="rl">${val}<div class="pista" id="rpista">Desliza y suelta: se guarda solo</div>
    <div class="regla-env"><div class="regla" id="regla"><div class="pista-c" style="width:calc(100% + ${ancho}px)"><div class="marcas" style="left:calc(${mitad});width:${ancho}px">${m}</div>${s}</div></div><div class="aguja"></div></div></div>`;
}

// ---------- pantalla ----------
function pintar() {
  const r = RES.find((x) => x[0] === st.sel);
  const d = st.dic != null ? DICTADO[st.dic] : null;
  const dic = d ? `<div class="dictado"><small>Dictado ${st.dic + 1} de ${DICTADO.length} · ${VARS.find((x) => x[0] === st.v)[1]} · ${HOJAS.find((x) => x[0] === st.h)[1].toLowerCase()}</small><b>${RES.find((x) => x[0] === d[0])[1]}</b> · ${NOM[d[1]]}${d[2] != null ? ` · <b>${fmt(d[2])} yd</b>` : ''}</div>` : '';
  const u = st.ultima ? `<div class="ultima"><span>Última: <b>${st.ultima.txt}</b></span><span class="t num">${st.ultima.s.toFixed(1)} s · ${st.ultima.toques} toques</span></div>` : '';
  let hoja = '';
  if (st.paso === 'quien') hoja = `<div class="velo" data-a="cancelar"></div><div class="hoja abajo"><h3>${r[3]}</h3><p>${r[4] ? 'Luego, cuánto avanzó.' : 'Un toque y se guarda.'}</p>
    <div class="pjs">${JUG.map(([id, n, i]) => `<button class="pj" data-a="quien" data-v="${id}"><span class="ini">${i}</span>${n}</button>`).join('')}<button class="pj" data-a="quien" data-v=""><span class="ini">?</span>No sé</button></div>
    <button class="cerrar" data-a="cancelar">Cancelar</button></div>`;
  if (st.paso === 'cuanto') hoja = `${st.h === 'abajo' ? '<div class="velo" data-a="sinyd"></div>' : ''}<div class="hoja ${st.h}"><h3>¿Cuánto avanzó?<small>${st.pend.txt}</small></h3>
    ${st.v === 'piz' ? pizarron() : reglaHTML()}
    <button class="sinyd" data-a="sinyd">Sin yardas</button></div>`;
  const lado = st.spot <= 25 ? `en nuestra ${Math.round(st.spot)}` : `en su ${Math.round(CAMPO - st.spot)}`;
  $('#tel').innerHTML = `<div class="pant">
    <div class="mcab"><div class="fila"><div class="marc"><img src="${LOGO}" alt=""><span class="num">${st.nos}</span></div><div class="down">${st.down}ª · ${lado}<br><small>vs BUC</small></div><div class="marc"><span class="num">0</span><img src="${RIVAL}" alt=""></div></div>
      <div class="conms"><div class="conm">${VARS.map(([k, t]) => `<button data-a="var" data-v="${k}" class="${st.v === k ? 'on' : ''}">${t}</button>`).join('')}</div><div class="conm">${HOJAS.map(([k, t]) => `<button data-a="hoja" data-v="${k}" class="${st.h === k ? 'on' : ''}">${k === 'abajo' ? '↥ Abajo' : '↧ Arriba'}</button>`).join('')}</div></div></div>
    <div class="cuerpo">${dic}
      <div class="pregunta">¿Qué pasó?</div>
      <div class="tiras">${RES.map(([k, t, p]) => `<button class="tira${k === 'td' ? ' td' : ''}" data-a="res" data-v="${k}"><svg viewBox="0 0 24 24">${ICO[k]}</svg><b>${t}</b><small>${p}</small></button>`).join('')}</div>
      ${u}
    </div>${hoja}
  </div>`;
  if (st.paso === 'cuanto' && st.v === 'piz') armarPizarron();
  if (st.paso === 'cuanto' && st.v === 'regla') armarRegla();
  notas();
}
function armarPizarron() {
  const el = $('#piz'); if (!el) return;
  el.addEventListener('click', (e) => {
    const [a, b] = ventana(), r = el.getBoundingClientRect();
    const y = Math.round(a + ((e.clientX - r.left) / r.width) * (b - a));
    st.yd = Math.max(-10, Math.min(CAMPO - st.spot, y - st.spot)); st.toques++;
    pintar();
    clearTimeout(tGuardar); tGuardar = setTimeout(() => { terminar(st.yd); pintar(); }, 450); // se ve dónde quedó y se guarda
  });
}
function armarRegla() {
  const el = $('#regla'); if (!el) return;
  el.scrollLeft = (0 - MIN) * PX;
  let tocado = false, toco = false;
  el.addEventListener('pointerdown', () => { tocado = true; if (!toco) { toco = true; st.toques++; } clearTimeout(tGuardar); });
  el.addEventListener('scroll', () => {
    if (!tocado) return;
    const y = Math.max(MIN, Math.min(MAX, Math.round(el.scrollLeft / PX) + MIN));
    st.yd = y; const v = $('#rval'); if (v) { v.classList.remove('vacio'); v.innerHTML = `${fmt(y)}<small>yd</small>`; }
    clearTimeout(tGuardar); tGuardar = setTimeout(() => { terminar(st.yd); pintar(); }, 700); // al soltar y quedarse quieta
  }, { passive: true });
}

// ---------- la jugada ----------
function terminar(yd) {
  const p = st.pend; if (!p) return;
  const s = (performance.now() - st.t0) / 1000;
  p.e.s = +s.toFixed(2); p.e.toques = st.toques; p.e.yd = yd; p.e.conYd = yd != null && p.pide;
  if (p.e.dic && p.d) p.e.err = p.d[2] == null ? null : yd != null ? Math.abs(yd - p.d[2]) : null;
  if (yd != null) st.spot = Math.max(1, Math.min(CAMPO - 1, st.spot + yd));
  st.ultima = { txt: p.txt + (yd != null ? ` · ${fmt(yd)} yd` : ''), s, toques: st.toques };
  poner('log', st.log);
  st.pend = null; st.paso = null; st.yd = null;
}
const A = {
  var: (v) => { st.v = v; poner('v', v); },
  hoja: (v) => { st.h = v; poner('h', v); },
  res: (v) => {
    if (st.paso === 'cuanto') A.sinyd(true); // tocar la siguiente jugada salta las yardas sin costar un toque
    st.sel = v; st.paso = 'quien'; st.t0 = performance.now(); st.toques = 1;
  },
  cancelar: () => { st.paso = null; st.sel = null; },
  quien: (id) => {
    st.toques++;
    const r = RES.find((x) => x[0] === st.sel), d = st.dic != null ? DICTADO[st.dic] : null;
    const txt = `${r[1].toLowerCase()}${id ? ' · ' + NOM[id] : ''}`;
    const e = { v: st.v, h: st.h, k: st.sel, yd: null, s: 0, toques: 0, dic: !!d, err: null, conYd: false };
    st.log.unshift(e); st.log = st.log.slice(0, 400);
    st.pend = { e, txt, d, pide: r[4] };
    st.down = st.down % 4 + 1;
    if (st.dic != null) st.dic = st.dic + 1 < DICTADO.length ? st.dic + 1 : null;
    if (st.sel === 'td') { terminar(CAMPO - st.spot); st.nos += 6; st.spot = 5; st.down = 1; return; }
    if (!r[4]) { terminar(null); return; }
    st.paso = 'cuanto'; st.yd = null;
  },
  sinyd: (deSiguiente) => { clearTimeout(tGuardar); if (deSiguiente !== true) st.toques++; terminar(null); },
  dictar: () => { st.dic = 0; st.paso = null; st.spot = 5; st.down = 1; },
  borrar: () => { st.log = []; poner('log', st.log); st.ultima = null; },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || !A[b.dataset.a]) return;
  e.preventDefault();
  A[b.dataset.a](b.dataset.v);
  pintar();
});

// ---------- números ----------
const media = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
function notas() {
  const filas = [];
  for (const [v, tv] of VARS) for (const [h, th] of HOJAS) {
    const l = st.log.filter((x) => x.v === v && x.h === h && x.toques), pide = (x) => RES.find((r) => r[0] === x.k)[4];
    const con = l.filter((x) => pide(x) && x.conYd), salta = l.filter((x) => pide(x) && !x.conYd), sin = l.filter((x) => !pide(x));
    const tc = media(con.map((x) => x.s)), ts = media(sin.map((x) => x.s)), qc = media(con.map((x) => x.toques)), qs = media(salta.map((x) => x.toques));
    const errs = l.filter((x) => x.dic && x.err != null).map((x) => x.err), em = media(errs);
    filas.push(`<tr><td><b>${tv}</b> · ${th.toLowerCase()}</td><td class="num">${l.length}</td><td class="num">${ts != null ? ts.toFixed(1) : '—'}</td><td class="num">${tc != null ? tc.toFixed(1) : '—'}</td><td class="num">${qc != null ? qc.toFixed(1) : '—'}</td><td class="num">${qs != null ? qs.toFixed(1) : '—'}</td>
      <td class="num">${qc != null ? 88 + Math.round((qc - 2) * 11) : '—'}</td><td class="num">${tc != null && ts != null ? '+' + Math.round((tc - ts) * 11) + ' s' : '—'}</td><td class="num">${em != null ? em.toFixed(1) + ' yd' : '—'}</td></tr>`);
  }
  $('#notas').innerHTML = `<h1>Prueba de yardas · vuelta 2</h1>
    <p>Dos pasos, uno a la vez: primero <b>¿Quién?</b> y, al escogerlo, sola, <b>¿Cuánto?</b>. La jugada ya quedó guardada al escoger quién; las yardas se le agregan con un toque. Saltarlas cuesta un toque (<b>Sin yardas</b>) o ninguno: con la hoja desde arriba la lista sigue a la vista y se puede tocar de una vez la siguiente jugada. El touchdown calcula sus yardas solo.</p>
    <ul><li><b>Pizarrón</b>: superficie táctica marino con líneas finas cada 5 yardas, la línea de la jugada en hielo y el balón como punto. Se pica dónde quedó y se guarda solo.</li>
    <li><b>Regla</b>: la opción más sobria: marcas finas, una aguja hielo y el número grande. Se desliza y se guarda al soltar.</li>
    <li><b>Hoja</b>: ¿Cuánto? entra desde abajo o desde arriba (conmutador del encabezado).</li></ul>
    <h2>Medir</h2>
    <p>El cronómetro va del primer toque (qué pasó) al final (yardas o «Sin yardas»). Para comparar parejo: el dictado, 8 jugadas iguales en cada combinación.</p>
    <div class="botones"><button data-a="dictar">Empezar dictado (8 jugadas)</button><button class="sec" data-a="borrar">Borrar mediciones</button></div>
    <h2>Resultados</h2>
    <table class="tabla"><tr><th>Variante</th><th>Jugadas</th><th>Seg. sin yd</th><th>Seg. con yd</th><th>Toques con yd</th><th>Toques saltando</th><th>Toques partido</th><th>+ seg. partido</th><th>Error dictado</th></tr>${filas.join('')}</table>
    <p style="color:var(--mut);font-size:12.5px">«Partido» = un partido típico (base 88 toques) con yardas en sus 11 jugadas de avance que las piden (pases completos, corridas y nos pararon); los 3 TD las calculan solos.</p>
    <h2>Últimas capturas</h2>
    <div class="log">${st.log.filter((x) => x.toques).slice(0, 30).map((x) => `<div><span>${VARS.find((v) => v[0] === x.v)[1]} ${x.h === 'arriba' ? '↧' : '↥'}</span><span>${RES.find((r) => r[0] === x.k)[1]}${x.yd != null ? ' · ' + fmt(x.yd) + ' yd' : ''}</span><span class="num">${x.s.toFixed(1)} s · ${x.toques} t</span></div>`).join('') || '<div><span>Todavía nada</span></div>'}</div>
    <h2>Referencias (Mobbin)</h2>
    <div class="refs"><a href="https://mobbin.com/screens/0b07b985-2ca4-4b34-9d29-c6fc0ae98357" target="_blank" rel="noopener">theScore · tiro marcado sobre la cancha ↗ (el pizarrón: picar la posición)</a>
    <a href="https://mobbin.com/screens/88b78f24-9b47-445f-b32c-5cc2a33c89d8" target="_blank" rel="noopener">BitePal · Servings ↗ (la de Iker)</a>
    <a href="https://mobbin.com/screens/ae721844-8b39-4121-8308-9a12db28b326" target="_blank" rel="noopener">Cal AI · regla deslizable ↗ (la regla limpia)</a></div>
    <p style="margin-top:14px"><a href="yardas-1.html">Vuelta 1 (cancha con pasto, todo en una hoja) ↗</a></p>`;
}
pintar();
</script>
</body>
</html>
