<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Inicio Belugas</title>
<link rel="icon" href="../archivos/marca/icon.png">
<!-- Prototipo de la pestaña Inicio del teléfono (ronda 5). Todo en este archivo; datos de ejemplo,
     nada se guarda. Plantel inventado con retratos dibujados aquí mismo (no son de nadie real).
     Rivales: los 12 logos reales de la liga (archivos/equipos/, mejorados con Higgsfield).
     El balón y la corona 3D los rendereó Blender (archivos/inicio/). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f3f5f8; --card: #fff; --ink: #0b1b33; --navy: #0d2347; --azul: #1d4f8f; --hielo: #5aaeff; --mut: #56647a; --tenue: #a3acb9; --linea: #e4e8ee; --ok: #16a05a;
  --sombra: 0 1px 2px rgba(11, 27, 51, .05), 0 6px 18px rgba(11, 27, 51, .07);
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --oro: linear-gradient(180deg, #ffe38c 0%, #f6b73c 55%, #dd8d16 100%);
  --plata: linear-gradient(180deg, #f1f4f8 0%, #c6cfda 60%, #9aa7b6 100%);
  --bronce: linear-gradient(180deg, #ffd9b5 0%, #d99257 60%, #a9602b 100%);
}
/* familias de gradiente: el marcador, el botón de Marcar, las tarjetas de jugador y el encabezado */
.tel[data-g="hielo"] {
  --grad: radial-gradient(120% 90% at 100% 0%, rgba(120,190,255,.85) 0%, rgba(120,190,255,0) 55%), linear-gradient(135deg, #0d2347 0%, #1d4f8f 62%, #3f8fe6 100%);
  --boton: linear-gradient(135deg, #0d2347 0%, #1d4f8f 55%, #5aaeff 100%);
  --anillo: conic-gradient(from 210deg, #0d2347, #5aaeff, #1d4f8f, #0d2347);
  --brillo: radial-gradient(70% 55% at 50% -10%, rgba(90,174,255,.20), transparent 70%);
  --acento: #1d4f8f;
}
.tel[data-g="aurora"] {
  --grad: radial-gradient(95% 90% at 0% 0%, rgba(90,174,255,1) 0%, rgba(90,174,255,0) 62%), radial-gradient(85% 95% at 100% 100%, rgba(20,216,196,.95) 0%, rgba(20,216,196,0) 60%), radial-gradient(75% 75% at 70% 15%, rgba(139,92,246,.95) 0%, rgba(139,92,246,0) 62%), linear-gradient(135deg, #0d2347 0%, #1b2a6b 100%);
  --boton: linear-gradient(120deg, #3b82f6 0%, #8b5cf6 50%, #14d8c4 100%);
  --anillo: conic-gradient(from 0deg, #5aaeff, #8b5cf6, #14d8c4, #5aaeff);
  --brillo: radial-gradient(55% 45% at 15% -5%, rgba(90,174,255,.22), transparent 70%), radial-gradient(50% 40% at 95% 0%, rgba(139,92,246,.16), transparent 70%);
  --acento: #5b4bd6;
}
.tel[data-g="cromo"] {
  --grad: linear-gradient(115deg, #0b1b33 0%, #17396c 30%, #6ea9e6 47%, #cfe6ff 50%, #6ea9e6 53%, #17396c 70%, #0b1b33 100%);
  --boton: linear-gradient(115deg, #0b1b33 0%, #1d4f8f 38%, #a9d3ff 50%, #1d4f8f 62%, #0b1b33 100%);
  --anillo: conic-gradient(from 160deg, #0b1b33, #cfe6ff, #1d4f8f, #9fc8f2, #0b1b33);
  --brillo: linear-gradient(180deg, rgba(13,35,71,.07), transparent 140px);
  --acento: #17396c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.35 Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: #e6eaf0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
.corta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* en la laptop: el teléfono al centro y las notas al lado; en el celular: pantalla completa */
.mesa { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 24px; }
.tel { width: 390px; height: 844px; border-radius: 46px; background: var(--bg); box-shadow: 0 0 0 10px #10151d, 0 30px 60px rgba(0,0,0,.25); position: relative; overflow: hidden; flex: none; }
.tel::before { content: ''; position: absolute; inset: 0 0 auto; height: 260px; background: var(--brillo); pointer-events: none; }
.notas { width: 380px; font-size: 14px; color: #334; max-height: 100vh; overflow-y: auto; }
.notas h1 { font: 800 20px/1.2 Inter; margin: 0 0 6px; }
.notas h4 { font: 700 12.5px/1 Inter; margin: 12px 0 0; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.notas p { margin: 6px 0; }
.notas ul { margin: 6px 0; padding-left: 18px; }
.notas a { color: var(--azul); }
.conm { display: inline-flex; flex-wrap: wrap; background: #d9dfe8; border-radius: 10px; padding: 3px; margin: 7px 0 0; }
.conm button { padding: 8px 12px; border-radius: 8px; font: 600 13px/1 Inter; }
.conm button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toques { background: #fff; border-radius: 12px; padding: 12px 14px; margin: 12px 0 8px; box-shadow: var(--sombra); }
.toques b { color: var(--navy); }
.dev { display: none; }
@media (max-width: 520px) {
  body { background: var(--bg); }
  .mesa { padding: 0; display: block; }
  .tel { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .notas { display: none; }
  .dev { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0 2px; }
  .dev button { height: 34px; min-width: 34px; border-radius: 999px; background: rgba(11,27,51,.07); padding: 0 11px; font: 700 12px/1 Inter; color: var(--ink); }
  .dev button.on { background: var(--ink); color: #fff; }
  .dev .sep { flex: 1; }
  .dev .fila2 { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
}

/* ---------- piezas de la app ---------- */
.pant { position: absolute; inset: 0; display: flex; flex-direction: column; }
.cuerpo { flex: 1; overflow-y: auto; padding: 0 20px 124px; position: relative; }
.estado { height: 50px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 8px 34px; font: 600 16px/1 Inter; position: relative; }
@media (max-width: 520px) { .estado { visibility: hidden; height: max(14px, env(safe-area-inset-top)); } }
.cab { display: flex; align-items: center; gap: 10px; padding: 8px 2px 20px; }
.cab img { width: 38px; height: 38px; object-fit: contain; }
.cab b { font: 800 20px/1 Inter; }
.cab small { display: block; color: var(--mut); font: 500 13px/1.2 Inter; margin-top: 3px; }
h2 { font: 800 15px/1.2 Inter; margin: 32px 2px 12px; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
h2 small { font: 600 12.5px/1 Inter; color: var(--mut); }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--sombra); }

/* retratos: siempre en círculo, con anillo de la familia de gradiente */
.foto { position: relative; flex: none; display: block; border-radius: 50%; padding: 2px; background: var(--anillo); }
.foto > span { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #fff; }
.foto svg, .foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
.foto .ini { display: grid; place-items: center; height: 100%; background: #e8eef7; color: var(--navy); font: 800 13px/1 Inter; }
.pila { display: flex; align-items: center; }
.pila .foto { width: 34px; height: 34px; margin-left: -9px; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.pila .foto:first-child { margin-left: 0; }
.pila .mas { margin-left: -9px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--navy); display: grid; place-items: center; font: 800 12px/1 Inter; box-shadow: 0 0 0 2px rgba(255,255,255,.9); text-shadow: none; }

/* logos de los rivales: el que nos manden, o sus letras si todavía no hay logo */
.rlogo { display: inline-block; flex: none; position: relative; }
.rlogo svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
.rlogo { width: 40px; height: 40px; }
.rlogo img { position: absolute; left: 50%; top: 50%; width: calc(100% * var(--k, 1)); height: calc(100% * var(--k, 1)); transform: translate(-50%, -50%); object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
.heroe .eq .rlogo img, .mscore .rlogo img, .gigante .marc .rlogo img { width: calc(100% * var(--kv, 1)); height: calc(100% * var(--kv, 1)); }

/* ICONOS-CSS-INICIO: un ícono por tipo de jugada, en dos estilos */
.ic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; }
.ic svg { width: 26px; height: 26px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ic.linea { background: color-mix(in srgb, var(--c) 12%, #fff); }
.ic.linea svg { stroke: var(--c); stroke-width: 1.9; }
.ic.relleno { background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.06); }
.ic.relleno svg { stroke: #fff; stroke-width: 2.7; }
.ic.relleno svg .f { fill: rgba(255,255,255,.95); stroke: none; }
.ic.linea svg .f { fill: color-mix(in srgb, var(--c) 30%, transparent); stroke: none; }
.ic.chico { width: 30px; height: 30px; border-radius: 9px; }
.ic.chico svg { width: 19px; height: 19px; }
.res.td .ic.linea, .res.tdr .ic.linea { background: rgba(255,255,255,.18); }
.res.td .ic.linea svg, .res.tdr .ic.linea svg { stroke: #fff; }
.res.td .ic.relleno, .res.tdr .ic.relleno { background: #fff; }
.res.td .ic.relleno svg { stroke: #1d4f8f; } .res.tdr .ic.relleno svg { stroke: #4b5563; }
.res.td .ic.relleno svg .f { fill: #1d4f8f; } .res.tdr .ic.relleno svg .f { fill: #4b5563; }
.jlista { margin-top: 20px; background: #fff; border-radius: 16px; box-shadow: var(--sombra); }
.jlista h4 { margin: 0; padding: 12px 14px 4px; font: 800 13px/1 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }
.jlista h4 button { font: 700 13px/1 Inter; color: var(--acento); text-transform: none; letter-spacing: 0; }
.jfila { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--linea); font-size: 14px; }
.jfila:first-of-type { border-top: 0; }
.jfila > .corta { flex: 1; min-width: 0; }
.jfila .ic { flex: none; }
.jfila small { color: var(--mut); font: 600 12px/1 Inter; flex: none; }
.convs .op { display: flex; align-items: center; justify-content: center; gap: 10px; }
.convs .op .ic.relleno { background: #fff; } .convs .op .ic.relleno svg { stroke: var(--c); } .convs .op .ic.relleno svg .f { fill: var(--c); }
.convs .op .ic.linea { background: rgba(255,255,255,.2); } .convs .op .ic.linea svg { stroke: #fff; }
/* ICONOS-CSS-FIN */

/* ANIM-INICIO: confirmación al marcar (no bloquea: nada atrapa el dedo) */
.tel.anim .toast.nuevo { animation: toastIn .22s cubic-bezier(.3,1.4,.5,1); }
.tel.anim .toast.nuevo .ic { animation: icPop .32s cubic-bezier(.3,1.7,.5,1); }
.tel.anim .toast.nuevo .ic::after { content: ''; position: absolute; inset: -4px; border-radius: 14px; border: 2px solid var(--c); animation: anillo .4s ease-out forwards; }
.toast .ic { position: relative; }
.tel.anim .mscore strong.sube { animation: bump .38s cubic-bezier(.3,1.6,.5,1); display: inline-block; }
.confeti { position: absolute; left: 50%; top: 150px; width: 0; height: 0; z-index: 20; pointer-events: none; }
.confeti i { position: absolute; width: 9px; height: 14px; border-radius: 2px; background: var(--k); opacity: 0; animation: chispa .75s cubic-bezier(.2,.7,.4,1) forwards; animation-delay: var(--d); }
.tdflash { position: absolute; inset: 0; z-index: 19; pointer-events: none; background: radial-gradient(60% 40% at 50% 22%, rgba(90,174,255,.32), transparent 70%); opacity: 0; animation: destello .6s ease-out; }
@keyframes toastIn { from { transform: translateY(14px) scale(.96); opacity: 0; } }
@keyframes icPop { from { transform: scale(.5) rotate(-12deg); } }
@keyframes anillo { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
@keyframes bump { 40% { transform: scale(1.28); } }
@keyframes chispa { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
@keyframes destello { 30% { opacity: 1; } }
/* ANIM-FIN */
.rlogo.sin { border-radius: 50%; background: linear-gradient(135deg, #4b5563, #9ca3af); color: #fff; display: grid; place-items: center; font: 800 12px/1 Inter; letter-spacing: .02em; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }

/* héroe del partido (Inicio 1): se queda como en la ronda 4 */
.heroe { border-radius: 22px; background: var(--grad); color: #fff; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 12px 28px rgba(13,35,71,.26); }
.heroe, .gigante, .mcab { text-shadow: 0 1px 3px rgba(5,15,35,.35); }
.btn-blanco, .gigante .tocar span { text-shadow: none; }
.heroe .balon { position: absolute; right: -30px; top: -14px; width: 150px; transform: rotate(-12deg); filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); pointer-events: none; }
.heroe .eti { font: 700 12px/1 Inter; letter-spacing: .08em; text-transform: uppercase; opacity: .9; display: flex; align-items: center; gap: 7px; position: relative; }
.heroe .eti i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 0 3px rgba(255,90,90,.3); }
.heroe .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 14px 96px 12px 0; position: relative; }
.heroe .vs .mid strong { white-space: nowrap; }
.heroe .eq { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 13px/1 Inter; }
.heroe .eq img, .heroe .eq .rlogo { width: 54px; height: 54px; }
.heroe .mid { text-align: center; }
.heroe .mid strong { font: italic 900 48px/1 var(--disp); letter-spacing: -.01em; text-shadow: 0 2px 10px rgba(0,0,0,.2); }
.heroe .mid small { display: block; font: 600 13px/1.3 Inter; opacity: .9; margin-top: 4px; }
.heroe .van { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font: 600 13px/1.2 Inter; position: relative; }
.heroe .van span { opacity: .9; }
.btn-blanco { width: 100%; height: 60px; border-radius: 14px; background: #fff; color: var(--navy); font: 800 18px/1 Inter; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 0 rgba(0,0,0,.08); position: relative; }
.btn-blanco:active, .gigante:active, .res:active, .pj:active, .op:active, .cat:active { transform: scale(.98); }

/* Inicio 2: el héroe entero es el botón */
.gigante { display: block; width: 100%; text-align: left; border-radius: 26px; background: var(--grad); color: #fff; padding: 22px 20px; min-height: 380px; position: relative; overflow: hidden; box-shadow: 0 16px 32px rgba(13,35,71,.3); }
.gigante .balon { position: absolute; right: -40px; top: 92px; width: 230px; transform: rotate(-18deg); filter: drop-shadow(0 16px 18px rgba(0,0,0,.35)); pointer-events: none; }
.gigante .eti { font: 700 12px/1 Inter; letter-spacing: .08em; text-transform: uppercase; opacity: .9; display: flex; gap: 7px; align-items: center; position: relative; }
.gigante .eti i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; }
.gigante .eti .rlogo { width: 26px; height: 26px; }
.gigante .rival { margin-top: 14px; font: italic 900 38px/.95 var(--disp); text-transform: uppercase; position: relative; max-width: 62%; }
.gigante .rival small { display: block; font: 600 14px/1.3 Inter; font-style: normal; text-transform: none; opacity: .9; margin-top: 8px; }
.gigante .marc { margin-top: 14px; display: flex; align-items: center; gap: 12px; font: italic 900 60px/1 var(--disp); position: relative; }
.gigante .marc img, .gigante .marc .rlogo { width: 48px; height: 48px; }
.gigante .van { position: absolute; left: 20px; bottom: 108px; display: flex; align-items: center; gap: 10px; font: 600 13px/1 Inter; }
.gigante .tocar { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 74px; border-radius: 18px; background: rgba(255,255,255,.18); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; font: 800 20px/1 Inter; }
.gigante .tocar span { width: 52px; height: 52px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; font: 400 30px/1 Inter; }

/* el gradiente se mueve muy despacio en aurora; en cromo brilla el botón */
.tel[data-g="aurora"] .heroe, .tel[data-g="aurora"] .gigante, .tel[data-g="aurora"] .mcab { background-size: 140% 140%; animation: deriva 14s ease-in-out infinite alternate; }
@keyframes deriva { from { background-position: 0% 0%; } to { background-position: 100% 60%; } }
.tel[data-g="cromo"] .btn-gr, .tel[data-g="cromo"] .nav .centro b { background-size: 220% 100%; animation: brilla 5s ease-in-out infinite; }
@keyframes brilla { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }

/* último y próximo partido */
.pmini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pm { display: flex; align-items: center; gap: 10px; padding: 12px; text-align: left; width: 100%; min-width: 0; }
.pm .rlogo { width: 40px; height: 40px; }
.pm small { display: block; font: 700 10.5px/1.2 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.pm b { display: block; font: 700 14px/1.2 Inter; }
.pm .sc { font: italic 900 22px/1 var(--disp); color: var(--navy); }
.pm .g { color: var(--ok); }

/* ---------- líderes ---------- */
.cats { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
.cat { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); font: 700 13px/1 Inter; color: var(--mut); }
.cat.on { background: var(--boton); color: #fff; box-shadow: 0 3px 0 rgba(13,35,71,.25); }
.lideres { background: #fff; border-radius: 22px; box-shadow: var(--sombra); overflow: hidden; }
.corona { position: relative; z-index: 3; display: block; pointer-events: none; filter: drop-shadow(0 4px 5px rgba(160,100,0,.35)); }
.valor { font: italic 900 24px/1 var(--disp); color: var(--navy); }
.valor small { font: 700 11px/1 Inter; font-style: normal; color: var(--mut); margin-left: 2px; }

/* versión 1: escalones */
.podio { display: grid; grid-template-columns: 1fr 1.18fr 1fr; align-items: end; gap: 8px; padding: 16px 12px 0; background: linear-gradient(180deg, #f6f9ff, #fff 70%); }
.pcol { display: flex; flex-direction: column; align-items: center; min-width: 0; text-align: center; }
.pcol .foto { width: 64px; height: 64px; box-shadow: 0 8px 16px rgba(13,35,71,.18); }
.pcol.p1 .foto { width: 86px; height: 86px; }
.pcol .corona { width: 62px; margin-bottom: -16px; }
.pcol b { display: block; max-width: 100%; font: 800 13.5px/1.2 Inter; margin-top: 7px; }
.pcol .valor { margin-top: 2px; }
.escalon { width: 100%; margin-top: 8px; border-radius: 14px 14px 0 0; display: grid; justify-items: center; align-content: start; padding-top: 8px; font: italic 900 36px/1 var(--disp); box-shadow: inset 0 5px 0 rgba(255,255,255,.35); }
.p1 .escalon { height: 104px; background: var(--grad); color: #fff; }
.p2 .escalon { height: 78px; background: var(--plata); color: #5b6676; }
.p3 .escalon { height: 60px; background: var(--bronce); color: #7a431b; }

/* versión 2: trono */
.trono { padding: 14px; display: grid; gap: 10px; background: linear-gradient(180deg, #fff8e6, #fff 75%); }
.rey { position: relative; display: flex; align-items: center; gap: 14px; padding: 36px 14px 14px; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #f2d58c, 0 10px 24px rgba(221,141,22,.18); overflow: hidden; }
.rey::after { content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: repeating-conic-gradient(rgba(246,183,60,.16) 0 10deg, transparent 10deg 20deg); pointer-events: none; }
.respaldo { position: relative; flex: none; width: 112px; height: 128px; border-radius: 56px 56px 18px 18px; background: var(--oro); box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.4); display: grid; place-items: end center; padding-bottom: 12px; }
.respaldo .foto { width: 84px; height: 84px; box-shadow: 0 0 0 4px #fff; }
.respaldo .corona { position: absolute; top: -26px; left: 50%; width: 74px; margin-left: -37px; }
.rey .txt { min-width: 0; position: relative; z-index: 1; }
.rey .txt small { display: block; font: 800 11px/1.2 Inter; letter-spacing: .07em; color: #b7700f; text-transform: uppercase; }
.rey .txt b { display: block; font: italic 900 30px/.95 var(--disp); text-transform: uppercase; margin: 4px 0 6px; }
.rey .txt .valor { font-size: 34px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sub { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 #e3e8ef, 0 6px 14px rgba(11,27,51,.06); min-width: 0; }
.sub .foto { width: 46px; height: 46px; }
.sub b { display: block; font: 800 13.5px/1.2 Inter; }
.sub .valor { font-size: 20px; }
.medalla-n { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 900 12px/1 Inter; color: #fff; box-shadow: 0 0 0 2px #fff; }
.medalla-n.n2 { background: var(--plata); color: #4b5563; }
.medalla-n.n3 { background: var(--bronce); }
.medalla-n.n1 { background: var(--oro); color: #7a4a00; }

/* versión 3: medallas */
.medallas { display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: end; gap: 6px; padding: 26px 12px 16px; background: radial-gradient(80% 70% at 50% 0%, #eef5ff, #fff 70%); }
.med { display: flex; flex-direction: column; align-items: center; min-width: 0; text-align: center; }
.med.m1 { transform: translateY(-12px); }
.aro { position: relative; z-index: 2; padding: 5px; border-radius: 50%; box-shadow: 0 8px 18px rgba(13,35,71,.16); }
.m1 .aro { background: conic-gradient(#fff3b0, #f5b301, #ffe27a, #e09b00, #fff3b0); }
.m2 .aro { background: conic-gradient(#ffffff, #b8c2cf, #eef2f6, #98a4b3, #ffffff); }
.m3 .aro { background: conic-gradient(#ffe0c2, #c97b3e, #f5c193, #a85f2a, #ffe0c2); }
.aro .foto { width: 62px; height: 62px; background: #fff; padding: 2px; }
.m1 .aro .foto { width: 84px; height: 84px; }
.cinta { width: 44px; height: 24px; margin-top: -8px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 68%, 0 100%); }
.m1 .cinta { background: var(--boton); width: 52px; height: 30px; }
.m2 .cinta { background: linear-gradient(90deg, #8b98a8, #c6cfda); }
.m3 .cinta { background: linear-gradient(90deg, #a9602b, #d99257); }
.med .corona { width: 54px; margin-bottom: -12px; }
.med b { display: block; max-width: 100%; font: 800 13.5px/1.2 Inter; margin-top: 6px; }
.lugar { position: absolute; left: 50%; bottom: -10px; margin-left: -13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 900 12.5px/1 Inter; background: #fff; color: var(--navy); box-shadow: 0 2px 6px rgba(0,0,0,.15); }

/* la tabla de abajo, compacta */
.tabla { border-top: 1px solid var(--linea); }
.tfila { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--linea); }
.tfila:last-child { border-bottom: 0; }
.tfila .rk { width: 20px; flex: none; text-align: center; font: 800 14px/1 Inter; color: var(--mut); }
.tfila .foto { width: 34px; height: 34px; }
.tfila > div { flex: 1; min-width: 0; }
.tfila b { display: block; font: 700 14px/1.2 Inter; }
.tfila small { color: var(--mut); font-size: 12px; }
.tfila .valor { font-size: 20px; flex: none; }
.vertodos { width: 100%; height: 48px; font: 700 14px/1 Inter; color: var(--acento); border-top: 1px solid var(--linea); }

/* entrada juguetona (no corre si el teléfono pide menos movimiento) */
.entra .escalon { transform-origin: bottom; animation: crece .55s cubic-bezier(.3,1.35,.5,1) both; }
.entra .p3 .escalon { animation-delay: .05s; } .entra .p2 .escalon { animation-delay: .15s; } .entra .p1 .escalon { animation-delay: .28s; }
.entra .pcol .foto, .entra .med .aro, .entra .sub, .entra .respaldo { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.entra .p3 .foto, .entra .m3 .aro { animation-delay: .35s; } .entra .p2 .foto, .entra .m2 .aro { animation-delay: .45s; } .entra .p1 .foto, .entra .m1 .aro, .entra .respaldo { animation-delay: .55s; }
.entra .dos .sub:first-child { animation-delay: .7s; } .entra .dos .sub:last-child { animation-delay: .8s; }
.entra .corona { animation: cae .7s cubic-bezier(.3,1.5,.5,1) .85s both; }
.entra .tfila { animation: sube .35s ease-out both; }
.entra .tfila:nth-child(2) { animation-delay: .05s; } .entra .tfila:nth-child(3) { animation-delay: .1s; } .entra .tfila:nth-child(4) { animation-delay: .15s; }
@keyframes crece { from { transform: scaleY(0); } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes cae { from { transform: translateY(-46px) rotate(-24deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.fila-j { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.fila-j .foto { width: 44px; height: 44px; }
.fila-j > div { flex: 1; }
.fila-j b { display: block; font: 700 15px/1.2 Inter; }
.fila-j small { color: var(--mut); font-size: 12.5px; }
.fila-j .dato { margin-left: auto; text-align: right; font: 600 12.5px/1.3 Inter; color: var(--mut); flex: none; }
.fila-j .dato strong { display: block; font: italic 900 22px/1 var(--disp); color: var(--navy); }

/* barra de abajo */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: calc(78px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--linea); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 9px; z-index: 5; }
.nav button { width: 64px; display: grid; justify-items: center; gap: 4px; font: 600 10.5px/1 Inter; color: #667185; }
.nav button.on { color: var(--navy); }
.nav svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .centro { width: 74px; height: 74px; margin-top: -30px; border-radius: 50%; background: #fff; border: 1.5px solid var(--linea); display: grid; place-items: center; }
.nav .centro b { width: 58px; height: 58px; border-radius: 50%; background: var(--boton); color: #fff; display: grid; place-items: center; font: 300 32px/1 Inter; box-shadow: 0 6px 14px rgba(13,35,71,.3); }

/* pantalla de marcar */
.mcab { background: var(--grad); color: #fff; padding: 0 14px 16px; border-radius: 0 0 24px 24px; flex: none; position: relative; }
.mbar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.mbar button { height: 38px; min-width: 38px; padding: 0 13px; border-radius: 999px; background: rgba(6,18,40,.3); font: 700 13px/1 Inter; color: #fff; }
.mscore { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 6px; }
.mscore .eq { display: flex; align-items: center; gap: 10px; }
.mscore .eq.r2 { justify-content: flex-end; }
.mscore img, .mscore .rlogo { width: 40px; height: 40px; }
.mscore strong { font: italic 900 52px/1 var(--disp); }
.mscore .down { text-align: center; font: 700 13px/1.3 Inter; color: #fff; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.14); }
.mscore .down small { display: block; opacity: .85; font-weight: 500; }
.lado { display: grid; grid-template-columns: 1fr 1fr; background: #e3e8ef; border-radius: 12px; padding: 4px; margin: 14px 0 4px; }
.lado button { height: 46px; border-radius: 9px; font: 700 15px/1 Inter; color: var(--mut); }
.lado button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.pregunta { font: 800 22px/1.2 Inter; margin: 22px 2px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pregunta .vista { display: inline-flex; background: #e3e8ef; border-radius: 9px; padding: 3px; flex: none; }
.pregunta .vista button { font: 700 11.5px/1 Inter; color: var(--mut); padding: 7px 9px; border-radius: 7px; }
.pregunta .vista button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res { background: #fff; border-radius: 16px; box-shadow: var(--sombra); min-height: 76px; padding: 12px; text-align: left; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; align-content: center; }
.res .ic { grid-row: span 2; }
.res b { font: 800 16px/1.15 Inter; }
.res small { color: var(--mut); font-size: 12px; margin-top: 3px; }
.res.td { grid-column: span 2; background: var(--boton); color: #fff; min-height: 76px; }
.res.td small { color: rgba(255,255,255,.88); }
.res.tdr { grid-column: span 2; background: linear-gradient(135deg, #374151, #6b7280 60%, #a3acb9); color: #fff; min-height: 76px; }
.res.tdr small { color: rgba(255,255,255,.88); }
.res.sec { grid-column: span 2; min-height: 54px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--linea); grid-template-columns: auto 1fr auto; }
.res.sec .ic { grid-row: auto; }
.res.sec small { margin-top: 0; }
/* tiras: una opción por renglón, a todo el ancho */
.grid.tiras { grid-template-columns: minmax(0, 1fr); gap: 8px; }
.grid.tiras .res { min-height: 58px; padding: 10px 16px; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 14px; border-radius: 14px; }
.grid.tiras .res .ic { grid-row: auto; }
.grid.tiras .res b { font: 700 16px/1.2 Inter; }
.grid.tiras .res small { margin-top: 0; text-align: right; font-size: 12.5px; }
.grid.tiras .res.td, .grid.tiras .res.tdr { grid-column: auto; min-height: 62px; }
.grid.tiras .res.sec { min-height: 58px; grid-column: auto; }
/* la jugada en la lista: qué pasó y quién, y el marcador a la derecha */
.jfila .mk { flex: none; font: italic 900 17px/1 var(--disp); color: var(--navy); min-width: 44px; text-align: right; }
.ultima { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--mut); padding: 0 2px; }
.ultima b { color: var(--ink); font-weight: 600; }
.ultima button { margin-left: auto; color: var(--acento); font: 700 13.5px/1 Inter; padding: 8px 0 8px 8px; flex: none; }
.ultima button + button { margin-left: 0; padding-left: 14px; border-left: 1px solid var(--linea); }

/* hojas de abajo */
.velo { position: absolute; inset: 0; background: rgba(11,27,51,.38); z-index: 10; animation: ap .15s ease-out; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 10px 16px calc(22px + env(safe-area-inset-bottom)); z-index: 11; animation: sube .2s ease-out; max-height: 88%; overflow-y: auto; }
.hoja::before { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #d3d9e2; margin: 0 auto 12px; }
/* «¿Cuánto avanzó?» baja desde arriba, sin velo: la lista sigue a la vista y tocar la siguiente jugada la cierra */
.hoja.arriba { top: 0; bottom: auto; border-radius: 0 0 24px 24px; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; box-shadow: 0 10px 30px rgba(11,27,51,.22); animation: baja .2s ease-out; }
.hoja.arriba::before { display: none; }
.hoja.arriba::after { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #d3d9e2; margin: 12px auto 0; }
.hoja.arriba h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hoja.arriba h3 small { font: 600 12.5px/1.2 Inter; color: var(--mut); text-align: right; }
.hoja .sinyd { width: 100%; margin-top: 12px; }
@keyframes baja { from { transform: translateY(-100%); } }
.pz { margin-top: 10px; height: 150px; border-radius: 16px; background: #0f2142; position: relative; overflow: hidden; cursor: crosshair; touch-action: manipulation; }
.pz > * { pointer-events: none; }
.pz-zona { position: absolute; top: 0; bottom: 0; background: rgba(90,174,255,.10); }
.pz-l { position: absolute; top: 12px; bottom: 24px; width: 1px; background: rgba(150,200,255,.22); }
.pz-l.d { background: rgba(150,200,255,.42); }
.pz-h { position: absolute; width: 1px; height: 5px; background: rgba(150,200,255,.22); }
.pz-n { position: absolute; bottom: 7px; transform: translateX(-50%); font: 700 10.5px/1 Inter; color: rgba(170,210,255,.6); }
.pz-scrim { position: absolute; top: 8px; bottom: 20px; width: 2px; margin-left: -1px; background: #5aaeff; }
.pz-scrim i { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #5aaeff; }
.pz-ruta { position: absolute; top: 74px; height: 2px; background: linear-gradient(90deg, rgba(90,174,255,.2), #5aaeff); }
.pz-punto { position: absolute; top: 75px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(90,174,255,.35); }
.pz-eti { position: absolute; top: 30px; transform: translateX(-50%); font: italic 900 24px/1 var(--disp); color: #fff; white-space: nowrap; }
.pz-eti small { font: 700 11px/1 Inter; font-style: normal; color: rgba(200,225,255,.8); margin-left: 3px; }
.pz-ayuda { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font: 600 12.5px/1 Inter; color: rgba(200,225,255,.75); }
.hoja h3 { font: 800 21px/1.2 Inter; margin: 4px 2px 4px; }
.hoja p { margin: 0 2px 14px; color: var(--mut); font-size: 14px; }
.hoja ul { margin: 0 2px 14px; padding-left: 18px; color: var(--ink); font-size: 14px; }
.hoja li { margin-bottom: 6px; }
.pjs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pj { background: var(--bg); border-radius: 16px; min-height: 104px; display: grid; justify-items: center; align-content: center; gap: 6px; padding: 8px 4px; font: 700 13px/1.1 Inter; min-width: 0; }
.pj .foto { width: 50px; height: 50px; }
.pj .corta { max-width: 100%; }
.pj small { color: var(--mut); font: 600 11px/1 Inter; }
.pj.cancha { background: #eaf2fd; }
.ops { display: grid; gap: 10px; }
.ops.dos { grid-template-columns: 1fr 1fr; }
.op { height: 64px; border-radius: 16px; background: var(--bg); font: 800 17px/1 Inter; }
.op.prim, .btn-gr { background: var(--boton); color: #fff; }
.op.sec { background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); color: var(--mut); font-weight: 700; }
.ops.fijo { position: sticky; bottom: 0; background: #fff; padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 12px -8px rgba(11,27,51,.08); }
.campo { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-size: 15px; }
.campo .izq { display: flex; align-items: center; gap: 10px; min-width: 0; }
.campo .izq .rlogo { width: 34px; height: 34px; }
.campo span.l { color: var(--mut); font-size: 12.5px; display: block; margin-bottom: 4px; }
.campo b { font-weight: 700; }
.campo u { text-decoration: none; color: var(--acento); font: 700 13.5px/1 Inter; flex: none; }
.lista-van { display: grid; gap: 6px; margin-bottom: 12px; }
.van-f { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 14px; background: var(--bg); }
.van-f .foto { width: 40px; height: 40px; }
.van-f > div { flex: 1; min-width: 0; }
.van-f b { display: block; font: 700 14.5px/1.2 Inter; }
.van-f small { color: var(--mut); font-size: 12px; }
.van-f .ck { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--linea); display: grid; place-items: center; flex: none; color: #fff; font: 800 14px/1 Inter; }
.van-f.si .ck { background: var(--boton); border-color: transparent; }
.van-f.no { opacity: .55; }
.toast { position: absolute; left: 14px; right: 14px; bottom: calc(96px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 14.5px; z-index: 8; animation: sube .2s ease-out; }
.toast .foto { width: 30px; height: 30px; }
.toast button { margin-left: auto; color: #9fd0ff; font: 800 14.5px/1 Inter; padding: 6px 0 6px 10px; flex: none; }
.lista { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.fila { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.fila .rlogo { width: 40px; height: 40px; }
.fila > div { flex: 1; min-width: 0; }
.fila b { font-weight: 700; display: block; }
.fila small { color: var(--mut); font-size: 13px; }
.fila .sc { margin-left: auto; text-align: right; font: italic 900 24px/1 var(--disp); color: var(--navy); flex: none; }
.fila .sc small { display: block; font: 800 11px/1.2 Inter; font-style: normal; }
.fila .sc small.g { color: var(--ok); } .fila .sc small.p { color: #d6453d; }
.info a { display: block; padding: 11px 2px; border-bottom: 1px solid var(--linea); color: var(--azul); text-decoration: none; font-size: 14.5px; }
.info a small { display: block; color: var(--mut); font-size: 12.5px; }
@keyframes sube { from { transform: translateY(24px); opacity: 0; } }
@keyframes ap { from { opacity: 0; } }
.ej { text-align: center; font: 600 10px/1 Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); margin-top: 22px; }


/* R6-INICIO: íconos simples, fichas, métricas, entrada */
.ic.simple { width: 34px; height: 34px; border-radius: 0; background: transparent; }
.ic.simple svg { width: 26px; height: 26px; stroke: var(--navy); stroke-width: 2; fill: none; }
.ic.simple.chico { width: 24px; height: 24px; } .ic.simple.chico svg { width: 20px; height: 20px; }
.res.td .ic.simple svg, .res.tdr .ic.simple svg, .convs .op .ic.simple svg { stroke: #fff; }
.toast .ic.simple svg { stroke: #fff; }
.volver { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px 0 8px; border-radius: 999px; background: rgba(11,27,51,.07); font: 700 13.5px/1 Inter; color: var(--ink); margin: 4px 0 8px; }
.fj-cab { border-radius: 22px; background: var(--grad); color: #fff; padding: 18px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 12px 26px rgba(13,35,71,.24); }
.fj-cab .foto { width: 84px; height: 84px; box-shadow: 0 0 0 3px rgba(255,255,255,.85); }
.fj-cab b { display: block; font: italic 900 30px/.95 var(--disp); text-transform: uppercase; }
.fj-cab small { display: block; font: 600 13px/1.3 Inter; opacity: .9; margin-top: 6px; }
.fj-cab .pts { margin-left: auto; text-align: right; flex: none; }
.fj-cab .pts strong { display: block; font: italic 900 40px/1 var(--disp); }
.fj-cab .pts span { font: 700 11px/1 Inter; opacity: .85; text-transform: uppercase; letter-spacing: .05em; }
/* tarjeta del jugador: logo arriba, nombre grande, medio cuerpo a la derecha, su número principal y tres más abajo */
.tj { position: relative; height: 468px; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #101d38 0%, #0d1730 100%); color: #fff; box-shadow: 0 14px 30px rgba(13,35,71,.28); margin-top: 2px; }
.tj-trazos { display: none; }
.tj-logo { position: absolute; top: 16px; left: 16px; width: 62px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); z-index: 2; }
.tj-nom { position: absolute; left: 18px; top: 92px; z-index: 3; font-family: var(--disp); font-style: italic; font-weight: 900; line-height: .9; text-transform: uppercase; letter-spacing: .005em; text-shadow: 0 2px 10px rgba(5,14,30,.35); }
.tj-nom span { display: block; }
.tj-nom em { display: block; font-style: italic; color: rgba(214,228,247,.72); margin-top: .08em; }
.tj-foto { position: absolute; right: 4px; bottom: 92px; width: 244px; z-index: 1; }
.tj.real .tj-foto { right: 0; bottom: 92px; width: 240px; height: 300px; }
.tj.real .tj-foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; filter: none; -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.35) 18%, #000 46%), linear-gradient(to bottom, transparent 0, rgba(0,0,0,.75) 4%, #000 9%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.35) 18%, #000 46%), linear-gradient(to bottom, transparent 0, rgba(0,0,0,.75) 4%, #000 9%); mask-composite: intersect; }
.tj-foto svg, .tj-foto img { display: block; width: 100%; filter: drop-shadow(-6px 0 18px rgba(5,14,30,.35)); }
.tj.sinfoto .tj-foto { right: 26px; bottom: 150px; width: 128px; height: 128px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; }
.tj .ini { font: italic 900 46px/1 var(--disp); color: #fff; }
.tj-main { position: absolute; left: 18px; bottom: 104px; z-index: 3; text-shadow: 0 2px 10px rgba(5,14,30,.35); }
.tj-main small { display: block; font: 700 12.5px/1 Inter; text-transform: uppercase; letter-spacing: .04em; opacity: .95; }
