<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Métricas Belugas</title>
<!-- Prototipo de Métricas (tarea belugas-metricas). Un solo archivo: los datos y los logos van adentro.
     NO se edita a mano: se arma con `node metricas/armar.mjs` desde metricas/fuente.html.
     Datos de ejemplo: los 3 primeros marcadores son los reales que trae la app; los otros 3 y todas
     las jugadas son inventados (metricas/generar-datos.mjs). Plantel inventado, el mismo de inicio.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f3f5f8; --card: #fff; --ink: #0b1b33; --navy: #0d2347; --azul: #1d4f8f; --hielo: #5aaeff; --mut: #56647a; --tenue: #a3acb9; --linea: #e4e8ee;
  --sombra: 0 1px 2px rgba(11,27,51,.05), 0 6px 18px rgba(11,27,51,.07);
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --grad: radial-gradient(120% 90% at 100% 0%, rgba(120,190,255,.85) 0%, rgba(120,190,255,0) 55%), linear-gradient(135deg, #0d2347 0%, #1d4f8f 62%, #3f8fe6 100%);
  --boton: linear-gradient(135deg, #0d2347 0%, #1d4f8f 55%, #5aaeff 100%);
  --anillo: conic-gradient(from 210deg, #0d2347, #5aaeff, #1d4f8f, #0d2347);
  --plata: linear-gradient(180deg, #f1f4f8 0%, #c6cfda 60%, #9aa7b6 100%);
  --bronce: linear-gradient(180deg, #ffd9b5 0%, #d99257 60%, #a9602b 100%);
  /* gráficas: Belugas en el azul de la marca (un paso más claro para pasar el validador), el rival en gris */
  --nos: #245ea8; --nos-suave: #cddcf1; --riv: #8a94a3; --riv-suave: #e3e7ed; --rejilla: #e4e8ee; --eje: #c4ccd8;
  /* estado: siempre con ícono y palabra, nunca solo el color */
  --bien: #0b6b3a; --bien-f: #e3f5ea; --mal: #b3261e; --mal-f: #fdecea; --igual-f: #eef1f5;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.4 Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--hielo); outline-offset: 2px; border-radius: 6px; }
a { color: var(--azul); }
.corta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
h2 { font: 800 15px/1.2 Inter; margin: 22px 2px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h2 small { font: 600 12.5px/1.2 Inter; color: var(--mut); text-align: right; }
h2 small button { color: var(--azul); font-weight: 700; }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--sombra); }
.ej { text-align: center; font: 600 10px/1.5 Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin: 22px 0 0; }

/* ---------- armazón: teléfono (columna y barra abajo) o laptop (barra al lado) ---------- */
#app { min-height: 100%; }
.lado { display: none; }
.cuerpo { padding: max(10px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; }
.cab { display: flex; align-items: center; gap: 10px; padding: 6px 2px 12px; }
.cab img { width: 38px; height: 38px; object-fit: contain; }
.cab b { font: 800 20px/1 Inter; display: block; }
.cab small { display: block; color: var(--mut); font: 500 13px/1.2 Inter; margin-top: 3px; }
.cab .info { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: rgba(11,27,51,.07); display: grid; place-items: center; font: 800 14px/1 Inter; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(66px + env(safe-area-inset-bottom)); padding: 8px 6px env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--linea); display: flex; justify-content: space-around; z-index: 5; }
.nav button { flex: 1; max-width: 96px; display: grid; justify-items: center; align-content: start; gap: 4px; font: 600 11px/1 Inter; color: #5d6a7e; }
.nav button.on { color: var(--navy); font-weight: 800; }
.nav svg, .lado nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.volver { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px 0 8px; border-radius: 999px; background: rgba(11,27,51,.07); font: 700 13.5px/1 Inter; margin: 4px 0 8px; }

.ancho .cuerpo { max-width: 1240px; margin: 0; padding: 22px 28px 60px; }
.ancho .nav { display: none; }
.ancho .cab { display: none; }
.ancho { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.ancho .lado { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; background: #fff; border-right: 1px solid var(--linea); overflow-y: auto; }
.lado .marca { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
.lado .marca img { width: 44px; height: 44px; object-fit: contain; }
.lado .marca b { font: 800 17px/1.1 Inter; display: block; }
.lado .marca small { font: 500 12px/1.2 Inter; color: var(--mut); }
.lado nav { display: grid; gap: 2px; }
.lado nav button { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px; border-radius: 10px; font: 600 14px/1 Inter; color: var(--mut); }
.lado nav button.on { background: #eaf1fb; color: var(--navy); font-weight: 800; }
.lado h4 { font: 700 11px/1 Inter; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); margin: 18px 6px 6px; }
.lado p { font: 500 12px/1.45 Inter; color: var(--mut); margin: 4px 6px; }
.lado .conm { margin: 0 4px; }

/* el teléfono enmarcado, para verlo desde la laptop */
body.marco { background: #e6eaf0; }
.marco #app { width: 390px; height: 844px; min-height: 0; margin: 20px auto; border-radius: 46px; box-shadow: 0 0 0 10px #10151d, 0 30px 60px rgba(0,0,0,.25); overflow: hidden; position: relative; background: var(--bg); transform: translateZ(0); }
.marco #app .scroll { height: 100%; overflow-y: auto; }
.marco .nav { position: absolute; }
.marco .hoja-cont { position: absolute; }
.salir-marco { display: none; }
.marco .salir-marco { display: block; position: fixed; left: 20px; top: 20px; height: 40px; padding: 0 16px; border-radius: 999px; background: #fff; box-shadow: var(--sombra); font: 700 13.5px/1 Inter; z-index: 30; }

/* conmutadores */
.conm { display: flex; background: #e3e8ef; border-radius: 11px; padding: 3px; gap: 2px; }
.conm button { flex: 1; min-height: 36px; padding: 6px 8px; border-radius: 8px; font: 700 12.5px/1.15 Inter; color: var(--mut); text-align: center; }
.conm button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.conm button small { display: block; font: 700 9.5px/1 Inter; letter-spacing: .05em; text-transform: uppercase; color: var(--azul); margin-top: 3px; }
.conm.col { flex-direction: column; }
.conm.col button { text-align: left; padding: 8px 10px; }
.pastillas { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; }
.pastillas::-webkit-scrollbar { display: none; }
.past { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); font: 700 13px/1 Inter; color: var(--mut); display: inline-flex; align-items: center; gap: 6px; }
.past.on { background: var(--boton); color: #fff; box-shadow: 0 3px 0 rgba(13,35,71,.25); }
.past img { width: 22px; height: 22px; object-fit: contain; }

/* logos y retratos */
.rlogo { display: inline-block; flex: none; }
.rlogo img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
.rlogo.sin { border-radius: 50%; background: linear-gradient(135deg, #4b5563, #9ca3af); color: #fff; display: grid; place-items: center; font: 800 11px/1 Inter; }
.foto { position: relative; flex: none; display: block; border-radius: 50%; padding: 2px; background: var(--anillo); }
.foto > span { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #fff; }
.foto svg { display: block; width: 100%; height: 100%; }
.foto .ini { display: grid; place-items: center; height: 100%; background: #e8eef7; color: var(--navy); font: 800 13px/1 Inter; }

/* ---------- partido: marcador ---------- */
.heroe { border-radius: 22px; background: var(--grad); color: #fff; padding: 16px 18px 18px; position: relative; overflow: hidden; box-shadow: 0 12px 28px rgba(13,35,71,.26); text-shadow: 0 1px 3px rgba(5,15,35,.35); }
.heroe .eti { font: 700 12px/1 Inter; letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
.heroe .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 12px 0 10px; }
.heroe .eq { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 13px/1 Inter; }
.heroe .eq .rlogo { width: 56px; height: 56px; }
.heroe .mid { text-align: center; font: italic 900 54px/1 var(--disp); white-space: nowrap; padding: 0 6px; }
.heroe .titular { font: 600 14.5px/1.4 Inter; margin: 0; }
.heroe .titular b { font-weight: 800; }
.ancho .heroe, .ancho .record, .ancho .fj { background: radial-gradient(90% 80% at 100% 0%, rgba(90,160,235,.5) 0%, rgba(90,160,235,0) 55%), linear-gradient(135deg, #0d2347 0%, #1d4f8f 68%, #2b6cc0 100%); }
.ancho .heroe { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; align-items: center; gap: 8px 28px; padding: 20px 26px; }
.ancho .heroe .eti { grid-column: 1 / -1; }
.ancho .heroe .vs { margin: 4px 0; }
.ancho .heroe .titular { font-size: 17px; }

/* ---------- fichas de métrica ---------- */
.fichas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ancho .fichas { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.ancho .fichas.seis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.ficha { background: #fff; border-radius: 16px; box-shadow: var(--sombra); padding: 12px 12px 11px; min-width: 0; display: flex; flex-direction: column; gap: 6px; width: 100%; position: relative; }
.ficha.doble { grid-column: span 2; }
.ancho .ficha.doble { grid-column: auto; }
.ficha .nom { font: 700 12px/1.2 Inter; color: var(--mut); padding-right: 22px; }
.ficha .inf { position: absolute; right: 9px; top: 9px; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--tenue); color: var(--mut); display: grid; place-items: center; font: 800 11px/1 Inter; }
.val { font: italic 900 34px/1 var(--disp); color: var(--navy); letter-spacing: .005em; white-space: nowrap; }
.val small { font: italic 800 19px/1 var(--disp); color: var(--mut); margin-left: 3px; }
.val em { font: 700 12px/1 Inter; font-style: normal; color: var(--mut); margin-left: 6px; }
.ficha .pie { font: 500 12px/1.3 Inter; color: var(--mut); }
.ficha .pie b { color: var(--ink); font-weight: 700; }
.pips { display: flex; gap: 3px; flex-wrap: wrap; }
.pips i { width: 14px; height: 14px; border-radius: 4px; background: var(--nos-suave); }
.pips i.si { background: var(--nos); }
.pips.riv i { background: var(--riv-suave); } .pips.riv i.si { background: var(--riv); }
.pips.ch i { width: 9px; height: 9px; border-radius: 3px; }
.metro { height: 8px; border-radius: 4px; background: var(--nos-suave); overflow: hidden; }
.metro i { display: block; height: 100%; background: var(--nos); border-radius: 0 4px 4px 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 999px; font: 700 11.5px/1 Inter; white-space: nowrap; }
.chip.mejor { background: var(--bien-f); color: var(--bien); }
.chip.peor { background: var(--mal-f); color: var(--mal); }
.chip.igual { background: var(--igual-f); color: var(--mut); }
.chip.gris { background: var(--igual-f); color: var(--mut); }
.dosn { display: flex; gap: 6px 18px; align-items: flex-end; flex-wrap: wrap; }
.dosn .val { display: block; }
.dosn .et { display: block; font: 600 11.5px/1.2 Inter; color: var(--mut); margin-top: 2px; }

/* tira de series: cómo acabó cada vez que alguien tuvo el balón */
.tira { padding: 12px 14px; display: grid; gap: 10px; }
.tira .fila { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px; }
.tira .fila > b { font: 700 12.5px/1.2 Inter; }
.tira .fila > b small { display: block; font: 600 11px/1.2 Inter; color: var(--mut); }
.cuadros { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.cuadros .sep { width: 1px; height: 22px; background: var(--eje); margin: 0 3px; }
.cq { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 800 11px/1 Inter; color: var(--mut); background: var(--igual-f); }
.cq svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cq.td { background: var(--nos); color: #fff; }
.riv .cq.td { background: var(--riv); color: #fff; }
.cq.int { background: #fff; color: var(--mal); box-shadow: inset 0 0 0 1.5px var(--mal); }
.cq.reloj { background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); color: #7c8798; }
.clave { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 11.5px/1 Inter; color: var(--mut); padding-top: 2px; }
.clave span { display: inline-flex; align-items: center; gap: 5px; }
.clave .cq { width: 20px; height: 20px; border-radius: 6px; font-size: 9px; }
.clave .cq svg { width: 12px; height: 12px; }

/* lo que funcionó y lo que no; destacados */
.dos { display: grid; gap: 8px; }
.lect { padding: 12px 14px; }
.lect h3 { margin: 0 0 8px; font: 800 13px/1 Inter; display: flex; align-items: center; gap: 7px; }
.lect h3 i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 Inter; font-style: normal; }
.lect.si h3 i { background: var(--bien-f); color: var(--bien); } .lect.no h3 i { background: var(--mal-f); color: var(--mal); }
.lect ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.lect li button { display: block; width: 100%; font: 500 14px/1.35 Inter; }
.lect li button b { font-weight: 700; }
.lect li.nada { color: var(--mut); font-size: 13.5px; }
.pp { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--linea); width: 100%; }
.pp:first-child { border-top: 0; }
.pp .rlogo { width: 34px; height: 34px; }
.pp .foto { width: 42px; height: 42px; }
.pp > div { flex: 1; min-width: 0; }
.pp b { display: block; font: 700 14px/1.2 Inter; }
.pp small { color: var(--mut); font-size: 12.5px; display: block; }
.pp .der { flex: none; text-align: right; }
.pp .der strong { display: block; font: italic 900 22px/1 var(--disp); color: var(--navy); }
.pp .der small.g { color: var(--bien); font-weight: 700; } .pp .der small.p { color: var(--mal); font-weight: 700; }
.pp .rk { width: 18px; flex: none; font: 800 13px/1 Inter; color: var(--mut); text-align: center; }

/* cara a cara */
.cara { padding: 4px 14px 8px; }
.cara .enc { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 0 8px; font: 800 12.5px/1 Inter; }
.cara .enc span { display: inline-flex; align-items: center; gap: 6px; }
.cara .enc span:last-child { justify-content: flex-end; }
.cara .enc i { width: 10px; height: 10px; border-radius: 3px; }
.cara .enc em { font: 600 11px/1 Inter; font-style: normal; color: var(--mut); }
.cara .nota-c { margin: 8px 0 4px; padding-top: 10px; border-top: 1px solid var(--linea); font: 500 12px/1.45 Inter; color: var(--mut); }
.cara h4 { margin: 12px 0 0; padding: 8px 0 2px; border-top: 1px solid var(--linea); font: 700 11px/1 Inter; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
.cr { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 8px 0; width: 100%; }
.cr .txt { display: grid; grid-template-columns: 76px 1fr 76px; align-items: baseline; gap: 6px; }
.cr .txt b { font: 600 15px/1.1 Inter; font-variant-numeric: tabular-nums; }
.cr .txt b.gana { font-weight: 800; }
.cr .txt b:last-child { text-align: right; }
.cr .txt span { text-align: center; font: 600 13px/1.2 Inter; color: var(--ink); }
.cr .txt span small { display: block; font: 500 11.5px/1.3 Inter; color: var(--mut); }
.cr .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.cr .bar div { height: 6px; background: var(--igual-f); display: flex; }
.cr .bar div:first-child { justify-content: flex-end; border-radius: 4px 0 0 4px; }
.cr .bar div:last-child { border-radius: 0 4px 4px 0; }
.cr .bar i { display: block; height: 100%; }
.cr .bar div:first-child i { background: var(--nos); border-radius: 4px 0 0 4px; }
.cr .bar div:last-child i { background: var(--riv); border-radius: 0 4px 4px 0; }

/* la historia */
.graf { padding: 14px 12px 10px; }
.graf svg { display: block; width: 100%; height: auto; overflow: visible; }
.graf .tit { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 8px; }
.graf .tit b { font: 800 13.5px/1.2 Inter; }
.graf .tit button { font: 700 12px/1 Inter; color: var(--azul); height: 28px; padding: 0 10px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--linea); flex: none; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 600 12px/1 Inter; color: var(--mut); margin: 0 2px 8px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 14px; height: 3px; border-radius: 2px; }
.leyenda i.cuad { width: 10px; height: 10px; border-radius: 3px; }
.leyenda i.raya { height: 0; border-top: 1.5px dashed var(--mut); background: none; border-radius: 0; }
svg text { font-family: Inter, system-ui, sans-serif; }
svg .golpe { fill: transparent; cursor: pointer; }
svg .golpe:focus-visible { outline: none; stroke: var(--hielo); stroke-width: 2; }
.tv { width: 100%; border-collapse: collapse; font-size: 13px; }
.tv th { text-align: right; font: 700 11px/1 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; padding: 8px 6px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
.tv td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--linea); font-variant-numeric: tabular-nums; }
.tv th:first-child, .tv td:first-child { text-align: left; }
.tv tr:last-child td { border-bottom: 0; }
.tv td.f { font-weight: 800; color: var(--navy); }
.tv .jn { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.tv .jn .foto { width: 28px; height: 28px; }
.tv .jn .rlogo { width: 24px; height: 24px; }
.tv tr[data-a] { cursor: pointer; }
.tv th button { font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.tv th.ord { color: var(--navy); }
.rueda { overflow-x: auto; }
.linea-t { padding: 4px 14px 10px; }
.linea-t h4 { margin: 0; padding: 12px 0 6px; font: 700 11px/1 Inter; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); display: flex; justify-content: space-between; }
.se { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linea); width: 100%; }
.se .q b { display: block; font: 700 13.5px/1.25 Inter; }
.se .q small { display: block; font: 500 12px/1.3 Inter; color: var(--mut); }
.se .m { text-align: right; font: italic 900 20px/1 var(--disp); color: var(--navy); white-space: nowrap; }
.se .m small { display: block; font: 600 11px/1.2 Inter; font-style: normal; color: var(--mut); margin-top: 2px; }
.se.menor .q b { font-weight: 500; color: var(--mut); }
.se.menor .m { font: 600 12px/1 Inter; color: var(--mut); }
.jugs { padding: 0 0 8px 40px; display: grid; gap: 4px; }
.jugs div { display: flex; gap: 8px; font: 500 12.5px/1.3 Inter; color: var(--mut); }
.jugs div span:first-child { width: 22px; flex: none; font-weight: 700; }

/* ---------- temporada ---------- */
.record { border-radius: 22px; background: var(--grad); color: #fff; padding: 16px 18px; box-shadow: 0 12px 28px rgba(13,35,71,.26); text-shadow: 0 1px 3px rgba(5,15,35,.35); display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; align-items: center; }
.record .rec { font: italic 900 60px/1 var(--disp); grid-row: span 2; }
.record .rec small { display: block; font: 700 11px/1 Inter; font-style: normal; letter-spacing: .08em; text-transform: uppercase; opacity: .9; margin-top: 4px; }
.record p { margin: 0; font: 600 14px/1.35 Inter; }
.record .ult { display: flex; gap: 5px; align-items: center; font: 700 12px/1 Inter; flex-wrap: wrap; }

// valor de una métrica con su texto; con menos de 10 no hay porcentaje
function valor(id, c) {
  const m = M[id], v = m.v(c);
  if (m.tipo === 'fr') return v.den >= 10 ? {g: `${pct(v.num, v.den)}<small>%</small>`, ch: `${v.num} de ${v.den}`, plano: `${pct(v.num, v.den)}%`, n: v.den} : {g: `${v.num}<small>de ${v.den}</small>`, ch: v.den ? '' : 'sin intentos', plano: `${v.num} de ${v.den}`, n: v.den};
  return {g: m.f(v), ch: '', plano: m.f(v), n: null};
}
// contra nuestro promedio: cuántas «cosas» de más o de menos que lo que solemos hacer (en los otros partidos)
function contra(id, g) {
  const m = M[id], c = C(g), o = C(otros(g)), sg = m.mejor === 'bajo' ? -1 : 1; let d, esp, real, txt;
  if (m.tipo === 'fr') { const a = m.v(c), b = m.v(o); if (!a.den || !b.den) return null; esp = b.num / b.den * a.den; real = a.num; d = real - esp; txt = `Con ${a.den} ${m.unidad}, lo nuestro de siempre serían ${esp.toFixed(1)}.`; }
  else { real = m.v(c); esp = otros(g).reduce((s, x) => s + m.v(C(x)), 0) / otros(g).length; d = real - esp; txt = `En los otros ${otros(g).length} partidos promediamos ${m.f(esp)}.`; }
  const z = d * sg / m.umbral;
  return {z, d, esp, real, txt, cls: z >= 1 ? 'mejor' : z <= -1 ? 'peor' : 'igual', eti: z >= 1 ? 'Mejor que de costumbre' : z <= -1 ? 'Peor que de costumbre' : 'Como de costumbre', corto: z >= 1 ? 'Mejor' : z <= -1 ? 'Peor' : 'Como siempre', sim: z >= 1 ? '▲' : z <= -1 ? '▼' : '●'};
}
const UNO = {series: 'serie', pases: 'pase', balones: 'balón', conversiones: 'conversión', jugadas: 'jugada', puntos: 'punto', sacks: 'sack', castigos: 'castigo'};
const tantos = (n, u) => `${n} ${n === 1 ? UNO[u] : u}`;
const chip = (k, largo) => k ? `<span class="chip ${k.cls}" title="${k.eti}"><span aria-hidden="true">${k.sim}</span>${largo ? k.eti : k.corto}</span>` : '';

// qué funcionó y qué no, en frases, a partir de las 5 de un vistazo
const CLAVE = ['serieAnot', 'serieFren', 'pases', 'balones', 'conv'];
// al picar una de un vistazo, estas explican su porqué
const MAS = {dif: ['mitades', 'racha', 'comoAnot'], serieAnot: ['finSeries', 'ptsSerie', 'buenas', 'media', 'cerrar', 'cuarta'], serieFren: ['frenadas', 'sacks'], pases: ['reparto', 'buenas'], balones: ['finSeries'], conv: ['unoODos']};
function lectura(g) {
  const c = C(g), r = rival(g), si = [], no = [], fr0 = (id) => M[id].v(c);
  const F = {
    serieAnot: [`Anotamos en <b>${c.A.td} de ${c.A.ser}</b> series.`, `Solo anotamos en <b>${c.A.td} de ${c.A.ser}</b> series.`],
    serieFren: [`La defensa frenó <b>${c.D.fren} de ${c.D.ser}</b> series.`, `Nos anotaron en <b>${c.D.td} de ${c.D.ser}</b> series.`],
    pases: [`Completamos <b>${c.A.pase} de ${c.A.att}</b> pases (${pct(c.A.pase, c.A.att)}%).`, `Solo completamos <b>${c.A.pase} de ${c.A.att}</b> pases (${pct(c.A.pase, c.A.att)}%).`],
    balones: [c.perdidas ? `Robamos <b>${c.robos}</b> ${c.robos === 1 ? 'balón' : 'balones'} y perdimos <b>${c.perdidas}</b>.` : `Robamos <b>${c.robos}</b> ${c.robos === 1 ? 'balón' : 'balones'} y no regalamos ninguno.`, `Regalamos <b>${c.perdidas}</b> ${c.perdidas === 1 ? 'balón' : 'balones'} y robamos <b>${c.robos}</b>.`],
    conv: [`Conversiones: <b>${fr0('conv').num} de ${fr0('conv').den}</b>.`, `Fallamos <b>${c.A.cInt - c.A.cOk} de ${c.A.cInt}</b> conversiones.`],
  };
  for (const id of CLAVE) { const k = contra(id, g); if (!k) continue; if (k.z >= 1) si.push([k.z, id, F[id][0]]); if (k.z <= -1) no.push([-k.z, id, F[id][1]]); }
  if (c.A.tdDef) si.push([2, 'comoAnot', `La defensa anotó <b>${c.A.tdDef}</b> touchdown.`]);
  si.sort((a, b) => b[0] - a[0]); no.sort((a, b) => b[0] - a[0]);
  const dif = c.pf - c.pc, gano = dif > 0, sin = (s) => s.replace(/<\/?b>/g, '');
  let t = `<b>${gano ? 'Ganamos' : 'Perdimos'} por ${Math.abs(dif)}.</b> `;
  const pr = gano ? si : no, ot = gano ? no : si;
  t += pr.length ? sin(pr[0][2]) + (pr[1] ? ' ' + sin(pr[1][2]) : '') : gano ? `Sin nada fuera de lo normal: anotamos en ${c.A.td} de ${c.A.ser} series y frenamos ${c.D.fren} de ${c.D.ser}.` : `Fue parejo: anotamos en ${c.A.td} de ${c.A.ser} series y ellos en ${c.D.td} de ${c.D.ser}.`;
  if (ot.length) t += ` ${gano ? 'A mejorar' : 'Lo bueno'}: ${sin(ot[0][2]).replace(/^./, (x) => x.toLowerCase())}`;
  return {si, no, titular: t, r};
}
