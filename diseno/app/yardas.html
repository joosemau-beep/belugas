<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba de yardas</title>
<link rel="icon" href="../archivos/marca/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f3f5f8; --card: #fff; --ink: #0b1b33; --navy: #0d2347; --azul: #1d4f8f; --hielo: #5aaeff; --mut: #56647a; --linea: #e4e8ee; --suave: #f1f4f8;
  --hecho: #1d4f8f; --ahora: #5aaeff; --falta: #e3e8ef; --perdio: #f08a7e;
  --sombra: 0 1px 2px rgba(11,27,51,.05), 0 6px 18px rgba(11,27,51,.07);
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body { font: 16px/1.35 Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: #e6eaf0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }

/* en la laptop: teléfono y notas; en el celular: pantalla completa y las notas abajo */
.mesa { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; gap: 36px; padding: 24px; }
.tel { width: 390px; height: 844px; border-radius: 46px; background: var(--bg); box-shadow: 0 0 0 10px #10151d, 0 30px 60px rgba(0,0,0,.25); position: relative; overflow: hidden; flex: none; }
.notas { width: 480px; font-size: 14px; color: #334; }
.notas h1 { font: 800 20px/1.2 Inter; margin: 4px 0 6px; }
.notas h2 { font: 700 12.5px/1 Inter; margin: 18px 0 8px; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.notas p { margin: 6px 0; }
.notas a { color: var(--azul); }
.notas ul { margin: 6px 0; padding-left: 18px; }
.notas li { margin: 3px 0; }
@media (max-width: 520px) {
  body { background: var(--bg); }
  .mesa { padding: 0; display: block; }
  .tel { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .notas { width: auto; padding: 18px 20px 40px; overflow-x: auto; }
  .tabla { font-size: 12px; }
}

/* ---------- el teléfono ---------- */
.pant { position: absolute; inset: 0; display: flex; flex-direction: column; }
.mcab { background: linear-gradient(135deg, #0d2347 0%, #1d4f8f 70%, #2f6fbf 100%); color: #fff; padding: max(14px, env(safe-area-inset-top)) 18px 14px; border-radius: 0 0 24px 24px; flex: none; position: relative; z-index: 3; }
.mcab .fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mcab .marc { font: italic 900 40px/1 var(--disp); display: flex; align-items: center; gap: 10px; }
.mcab .marc img { width: 34px; height: 34px; object-fit: contain; }
.mcab .vs { font: 700 12px/1 Inter; opacity: .8; }
.vrs { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
.vrs .grupo { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.14); border-radius: 12px; padding: 3px; }
.vrs .grupo button { height: 34px; border-radius: 9px; font: 800 13px/1 Inter; color: rgba(255,255,255,.85); }
.vrs .grupo button.on { background: #fff; color: var(--navy); }
.dir { flex: none; display: flex; background: rgba(255,255,255,.14); border-radius: 12px; padding: 3px; }
.dir button { width: 34px; height: 34px; border-radius: 9px; font: 800 14px/1 Inter; color: rgba(255,255,255,.85); }
.dir button.on { background: #fff; color: var(--navy); }
.cuerpo { flex: 1; overflow-y: auto; padding: 0 20px 30px; }
.dictado { margin: 14px 0 0; background: #fff; border-radius: 14px; box-shadow: var(--sombra); padding: 12px 14px; font: 600 14px/1.35 Inter; }
.dictado b { font-weight: 800; }
.dictado small { display: block; color: var(--mut); font: 600 12px/1.2 Inter; margin-bottom: 2px; }
.serie { margin-top: 16px; background: #fff; border-radius: 18px; box-shadow: var(--sombra); padding: 16px; }
.aviso { margin-top: 12px; display: inline-flex; gap: 6px; align-items: center; background: #e6f4ec; color: #14532d; font: 800 13px/1 Inter; padding: 8px 12px; border-radius: 999px; }
.pregunta { font: 800 22px/1.2 Inter; margin: 22px 2px 12px; }
.tiras { display: grid; gap: 8px; }
.tira { background: #fff; border-radius: 14px; box-shadow: var(--sombra); min-height: 56px; padding: 10px 16px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; column-gap: 14px; text-align: left; }
.tira svg { width: 22px; height: 22px; fill: none; stroke: var(--navy); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tira b { font: 700 16px/1.2 Inter; }
.tira small { color: var(--mut); font-size: 12.5px; }
.tira.td { background: linear-gradient(135deg, #0d2347 0%, #1d4f8f 55%, #5aaeff 100%); color: #fff; }
.tira.td svg { stroke: #fff; } .tira.td small { color: rgba(255,255,255,.85); }
.tira:active, .pj:active, .sinyd:active, .pmb:active { transform: scale(.97); }
.ultima { margin-top: 14px; font-size: 13px; color: var(--mut); display: flex; gap: 8px; align-items: center; }
.ultima b { color: var(--ink); }
.ultima .t { margin-left: auto; font: 700 12px/1 Inter; color: var(--azul); flex: none; }

/* hojas */
.velo { position: absolute; inset: 0; background: rgba(8,16,32,.34); z-index: 8; }
.hoja { position: absolute; left: 0; right: 0; z-index: 9; background: #fff; padding: 12px 20px 18px; box-shadow: 0 -10px 30px rgba(0,0,0,.18); }
.hoja.abajo { bottom: 0; border-radius: 26px 26px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); animation: subir .22s cubic-bezier(.2,.8,.3,1); }
.hoja.arriba { top: 0; border-radius: 0 0 26px 26px; padding-top: calc(16px + env(safe-area-inset-top)); box-shadow: 0 10px 30px rgba(0,0,0,.18); animation: bajar .22s cubic-bezier(.2,.8,.3,1); }
.hoja.abajo::before { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #d6dce5; margin: 0 auto 12px; }
.hoja.arriba::after { content: ''; display: block; width: 38px; height: 5px; border-radius: 3px; background: #d6dce5; margin: 12px auto 0; }
@keyframes subir { from { transform: translateY(100%); } }
@keyframes bajar { from { transform: translateY(-100%); } }
@media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
.hoja h3 { margin: 0; font: 800 19px/1.2 Inter; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hoja h3 small { font: 600 13px/1.2 Inter; color: var(--mut); text-align: right; }
.hoja p { margin: 4px 0 0; color: var(--mut); font-size: 13px; }
.pjs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.pj { display: grid; justify-items: center; gap: 6px; padding: 10px 2px 9px; border-radius: 14px; background: var(--suave); font: 600 12.5px/1.1 Inter; }
.pj .ini { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #e2eaf5; color: var(--navy); font: 800 14px/1 Inter; box-shadow: inset 0 0 0 2px #fff, 0 0 0 1.5px #c9d6e8; }
.cerrar { margin-top: 12px; width: 100%; height: 46px; border-radius: 14px; font: 700 14px/1 Inter; color: var(--mut); background: var(--suave); }
.sinyd { margin-top: 14px; width: 100%; height: 52px; border-radius: 16px; font: 700 16px/1 Inter; color: var(--navy); background: #eef2f8; }

/* ---------- las barritas de arriba (avance y oportunidad), en sus cuatro versiones ---------- */
.br { display: grid; gap: 8px; }
.br .tr { position: relative; height: 12px; border-radius: 8px; background: var(--falta); overflow: hidden; }
.br .tr i { position: absolute; top: 0; bottom: 0; }
.br .tr .h { background: var(--hecho); }
.br .tr .a { background: var(--ahora); }
.br .tr .p { background: var(--perdio); }
.br .fin { display: flex; justify-content: space-between; align-items: center; }
.br .dw { display: flex; gap: 5px; }
.br .dw i { width: 22px; height: 8px; border-radius: 4px; background: var(--falta); }
.br .dw i.ya { background: #9fb3cc; }
.br .dw i.ahora { background: var(--navy); }
.br .meta { font: 800 12px/1 Inter; color: var(--mut); }
/* A · tramo y cuatro oportunidades al lado */
.brA { grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
/* B · cuatro oportunidades grandes encima del tramo */
.brB .dw { gap: 6px; } .brB .dw i { flex: 1; height: 10px; border-radius: 6px; width: auto; }
.brB .tr { height: 8px; }
/* C · bloques de 5 yardas */
.brC .bl { display: flex; gap: 4px; }
.brC .bl span { flex: 1; height: 16px; border-radius: 5px; background: var(--falta); position: relative; overflow: hidden; }
.brC .bl span i { position: absolute; top: 0; bottom: 0; }
.brC .bl span .h { background: var(--hecho); } .brC .bl span .a { background: var(--ahora); }
.brC .fin .dn { font: italic 900 20px/1 var(--disp); color: var(--navy); }
/* D · una sola línea fina con las oportunidades como puntos */
.brD { grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.brD .tr { height: 6px; }
.brD .dw i { width: 8px; height: 8px; border-radius: 50%; }

/* ---------- el selector: número grande, más y menos grandes, y la barra ---------- */
.sel { margin-top: 16px; user-select: none; -webkit-user-select: none; }
.pm { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; gap: 8px; }
.pmb { width: 76px; height: 76px; border-radius: 50%; background: var(--suave); font: 300 40px/1 Inter; color: var(--navy); display: grid; place-items: center; touch-action: none; }
.val { text-align: center; color: var(--ink); }
.val small { font: 700 15px/1 Inter; color: var(--mut); margin-left: 4px; font-style: normal; }
.vA .val { font: italic 900 92px/.9 var(--disp); }
.vB .val { font: 800 72px/1 Inter; letter-spacing: -.03em; }
.vB .val small { font-size: 16px; }
.vC .val { font: italic 900 116px/.85 var(--disp); }
.vD .val { font: italic 800 80px/.9 var(--disp); }
.th { position: relative; height: 72px; margin-top: 16px; overflow-x: scroll; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent); cursor: grab; }
.th::-webkit-scrollbar { display: none; }
.th-p { position: relative; height: 100%; }
.th-m { position: absolute; top: 0; bottom: 0; }
.snap { position: absolute; top: 0; height: 100%; width: 1px; scroll-snap-align: center; }
.env { position: relative; }
.bp { position: absolute; top: 20px; bottom: 20px; width: 4px; margin-left: -2px; border-radius: 3px; background: #dfe4eb; }
.bp.c { top: 10px; bottom: 10px; background: #cfd6e0; }
.bp.h { background: var(--hecho); } .bp.a { background: var(--ahora); } .bp.p { background: var(--perdio); }
.bp.m::after { content: ''; position: absolute; left: 50%; top: -10px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--navy); }
.aguja { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 4px; margin-left: -2px; border-radius: 3px; background: var(--navy); pointer-events: none; z-index: 2; }
.vD .aguja { width: 3px; margin-left: -1.5px; }
.vC .bp { width: 5px; margin-left: -2.5px; }

/* panel de resultados (en las notas) */
.tabla { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--sombra); font-size: 13px; }
.tabla th, .tabla td { padding: 7px 7px; text-align: right; border-top: 1px solid var(--linea); }
.tabla th { background: var(--suave); font: 700 10.5px/1.15 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
.tabla td:first-child, .tabla th:first-child { text-align: left; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.botones button { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--navy); color: #fff; font: 700 13px/1 Inter; }
.botones button.sec { background: #d9dfe8; color: var(--ink); }
.log { max-height: 220px; overflow-y: auto; background: #fff; border-radius: 12px; box-shadow: var(--sombra); font-size: 12.5px; }
.log div { display: flex; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--linea); }
.log div:first-child { border-top: 0; }
.log span:last-child:not(:first-child) { margin-left: auto; color: var(--mut); white-space: nowrap; }
.leyenda { display: flex; gap: 12px; flex-wrap: wrap; font: 600 12.5px/1 Inter; color: var(--mut); }
.leyenda i { display: inline-block; width: 18px; height: 8px; border-radius: 4px; vertical-align: middle; margin-right: 5px; }
</style>
</head>
<body>
<div class="mesa">
  <div class="tel" id="tel"></div>
  <div class="notas" id="notas"></div>
</div>
<script>
// Prueba de yardas, vuelta 4: la 10 (más y menos con la barra) y la 1 (ver los datos) en una sola dirección.
// Número grande, más y menos grandes, y la barra que pinta en un color lo ya avanzado de la serie y en otro lo de
// esta jugada. Arriba, solo barritas: cuánto falta para la primera o el TD y en qué oportunidad van.
// Dos pasos (primero quién, luego cuánto), guardado al soltar, cronómetro y dictado.
// Tochito como NFL Flag: 50 yardas; cada serie empieza en nuestra 5; hay que cruzar medio campo (25) para la primera.
const LOGO = '../archivos/marca/logo.webp', RIVAL = '../archivos/equipos/bucaneros-256.png?v=9';
const CAMPO = 50, PRIMERA = 25;
const JUG = [['sr', 'Santiago', 'SR'], ['eo', 'Emiliano', 'EO'], ['mv', 'Mateo', 'MV'], ['rs', 'Rodrigo', 'RS'], ['me', 'Maximiliano', 'ME'], ['ic', 'Iván', 'IC'], ['lp', 'Leo', 'LP']];
const NOM = Object.fromEntries(JUG.map(([id, n]) => [id, n]));
const RES = [
  ['pase', 'Pase completo', 'Luego quién y cuánto', '¿Quién la atrapó?', true],
  ['corrida', 'Corrida', 'Luego quién y cuánto', '¿Quién corrió?', true],
  ['incompleto', 'Incompleto', 'Luego a quién iba', '¿A quién iba?', false],
  ['parada', 'Nos pararon', 'Luego a quién y cuánto', '¿A quién pararon?', true],
  ['int', 'Intercepción', 'Cambia la posesión', '¿Quién la lanzó?', false],
  ['castigo', 'Castigo', '5 yardas, a favor o en contra', null, false],
  ['td', 'Touchdown', 'Las yardas salen solas', '¿Quién anotó?', false],
];
const ICO = {
  pase: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', corrida: '<path d="M4 12h14M13 6l6 6-6 6"/>', incompleto: '<path d="M7 7l10 10M17 7 7 17"/>',
  parada: '<path d="M3.5 12H13M9.5 8.5 13 12l-3.5 3.5M18 5v14"/>', int: '<path d="M18 5v6a5 5 0 0 1-5 5H6M10 12l-4 4 4 4"/>', castigo: '<path d="M6 21V4h11l-2.5 4L17 12H6"/>',
  td: '<path d="M12 20v-7M6 13h12M6 13V4.5M18 13V4.5"/>',
};
// las cuatro versiones: cambian las barritas de arriba y el peso del número
const VARS = [
  { k: 'A', n: 'Tramo y oportunidades', nota: 'Una barra hacia la meta (primera o TD) y, a la derecha, cuatro rayitas: la oscura es la oportunidad en que van. Número grande en cursiva.' },
  { k: 'B', n: 'Oportunidades arriba', nota: 'Cuatro segmentos anchos para las oportunidades y, debajo, una línea fina del avance. Número recto, más sobrio.' },
  { k: 'C', n: 'Bloques de 5', nota: 'El camino a la meta en bloques de 5 yardas que se van pintando; la oportunidad, solo como «2ª». Número enorme.' },
  { k: 'D', n: 'Una línea', nota: 'Lo mínimo: cuatro puntitos para las oportunidades y una línea fina para el avance. Número mediano.' },
];
const DICTADO = [['pase', 'eo', 7], ['corrida', 'mv', 3], ['incompleto', 'rs', null], ['pase', 'me', 12], ['parada', 'mv', -2], ['corrida', 'ic', 5], ['pase', 'rs', 18], ['td', 'me', null]];

const leer = (k, d) => { try { const v = localStorage.getItem('yardas4.' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const poner = (k, v) => { try { localStorage.setItem('yardas4.' + k, JSON.stringify(v)); } catch { /* sin guardado, no pasa nada */ } };
let st = { v: leer('v', 'A'), h: leer('h', 'abajo'), nos: 0, down: 1, spot: 5, ini: 5, primera: false, incierto: false, auto: 0, sel: null, paso: null, yd: 0, t0: 0, toques: 0, dic: null, ultima: null, pend: null, aviso: null, log: leer('log', []) };
const $ = (s) => document.querySelector(s);
const fmt = (y) => (y > 0 ? '+' : '') + y;
const meta = () => (st.primera || st.spot >= PRIMERA ? CAMPO : PRIMERA);
const rango = () => [Math.max(-12, -st.spot), CAMPO - st.spot];
const PX = 15; // la barra: 15 px por yarda
let tG;

// ---------- las barritas de arriba: del inicio del tramo a la meta; lo hecho y lo de esta jugada ----------
function barras(y, k) {
  const m = meta(), a = m === CAMPO && st.primera ? PRIMERA : st.ini, tramo = Math.max(1, m - a); // ya con primera, el tramo va de medio campo al TD
  const pc = (f) => Math.max(0, Math.min(100, ((f - a) / tramo) * 100));
  const f = st.spot + y, hechoA = pc(st.spot);
  const capa = y >= 0 ? `<i class="h" style="left:0;width:${hechoA}%"></i><i class="a" style="left:${hechoA}%;width:${pc(f) - hechoA}%"></i>`
    : `<i class="h" style="left:0;width:${pc(f)}%"></i><i class="p" style="left:${pc(f)}%;width:${hechoA - pc(f)}%"></i>`;
  const dw = `<span class="dw">${[1, 2, 3, 4].map((d) => `<i class="${d < st.down ? 'ya' : d === st.down ? 'ahora' : ''}"></i>`).join('')}</span>`;
  const marca = m === CAMPO ? 'TD' : '1ª';
  if (k === 'A') return `<div class="br brA"><div class="tr">${capa}</div>${dw}</div>`;
  if (k === 'B') return `<div class="br brB">${dw}<div class="tr">${capa}</div></div>`;
  if (k === 'C') {
    const n = Math.max(1, Math.round(tramo / 5));
    let bl = '';
    for (let i = 0; i < n; i++) {
      const b0 = a + (i * tramo) / n, b1 = a + ((i + 1) * tramo) / n, en = (x0, x1) => Math.max(0, Math.min(1, (Math.min(x1, b1) - Math.max(x0, b0)) / (b1 - b0))) * 100;
      const h = en(a, y >= 0 ? st.spot : f), ah = y > 0 ? en(st.spot, f) : 0;
      bl += `<span><i class="h" style="left:0;width:${h}%"></i><i class="a" style="left:${h}%;width:${ah}%"></i></span>`;
    }
    return `<div class="br brC"><div class="bl">${bl}</div><div class="fin"><span class="dn">${st.down}ª</span><span class="meta">${marca}</span></div></div>`;
  }
  return `<div class="br brD">${dw}<div class="tr">${capa}</div></div>`;
}

// ---------- la barra de la 10: se desliza; pinta la serie y esta jugada ----------
function tiraH() {
  const f0 = Math.max(0, st.spot - 12), f1 = CAMPO, ancho = (f1 - f0) * PX, mitad = `((100% - ${ancho}px) / 2)`;
  let m = '', s = '';
  for (let f = f0; f <= f1; f++) {
    const x = (f - f0) * PX;
    m += `<i class="bp${f % 5 === 0 ? ' c' : ''}${f === meta() ? ' m' : ''}" data-f="${f}" style="left:${x}px"></i>`;
    s += `<div class="snap" style="left:calc(${mitad} + ${x}px)"></div>`;
  }
  return `<div class="env"><div class="th" data-f0="${f0}"><div class="th-p" style="width:calc(100% + ${ancho}px)"><div class="th-m" style="left:calc(${mitad});width:${ancho}px">${m}</div>${s}</div></div><div class="aguja"></div></div>`;
}
function pintarBarra(y) {
  const f = st.spot + y;
  document.querySelectorAll('.bp').forEach((b) => {
    const x = +b.dataset.f;
    b.classList.toggle('h', x >= st.ini && x <= Math.min(st.spot, f));
    b.classList.toggle('a', y > 0 && x > st.spot && x <= f);
    b.classList.toggle('p', y < 0 && x > f && x <= st.spot);
  });
}
function setYd(y, ms) {
  const [lo, hi] = rango(); y = Math.max(lo, Math.min(hi, Math.round(y)));
  if (y !== st.yd) {
    st.yd = y;
    const v = $('#val'); if (v) v.innerHTML = `${fmt(y)}<small>yd</small>`;
    const b = $('#brs'); if (b) b.innerHTML = barras(y, st.v);
    pintarBarra(y);
  }
  if (ms != null) programar(ms);
}
function programar(ms) { clearTimeout(tG); tG = setTimeout(() => { terminar(st.yd); pintar(); }, ms); }
function montar(el) {
  const th = el.querySelector('.th'), f0 = +th.dataset.f0; let armado = false;
  const centrar = (y) => { armado = false; th.scrollLeft = (st.spot + y - f0) * PX; };
  centrar(st.yd); pintarBarra(st.yd);
  ['pointerdown', 'wheel', 'touchstart'].forEach((t) => th.addEventListener(t, () => { armado = true; }, { passive: true }));
  th.addEventListener('scroll', () => { if (armado) setYd(Math.round(th.scrollLeft / PX) + f0 - st.spot, 700); }, { passive: true });
  // con el ratón también se arrastra (en el celular ya se desliza con el dedo)
  th.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse') return;
    const s0 = th.scrollLeft, x0 = e.clientX;
    const mover = (ev) => { th.scrollLeft = s0 - (ev.clientX - x0); };
    const soltar = () => { window.removeEventListener('pointermove', mover); window.removeEventListener('pointerup', soltar); };
    window.addEventListener('pointermove', mover); window.addEventListener('pointerup', soltar);
  });
  // más y menos: un toque es una yarda; dejarlo apretado sigue sumando
  el.querySelectorAll('.pmb').forEach((b) => {
    let t1 = null, t2 = null;
    const paso = () => { setYd(st.yd + +b.dataset.pm); centrar(st.yd); };
    const parar = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; programar(1000); };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); clearTimeout(tG); paso(); t1 = setTimeout(() => { t2 = setInterval(paso, 90); }, 380); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => b.addEventListener(t, () => { if (t1 || t2) parar(); }));
  });
}

// ---------- pantalla ----------
function pintar() {
  const r = RES.find((x) => x[0] === st.sel), V = VARS.find((x) => x.k === st.v);
  const d = st.dic != null ? DICTADO[st.dic] : null;
  const dic = d ? `<div class="dictado"><small>Dictado ${st.dic + 1} de ${DICTADO.length} · ${V.k} ${V.n}</small><b>${RES.find((x) => x[0] === d[0])[1]}</b> · ${NOM[d[1]]}${d[2] != null ? ` · <b>${fmt(d[2])} yd</b>` : ''}</div>` : '';
  const u = st.ultima ? `<div class="ultima"><span>Última: <b>${st.ultima.txt}</b></span><span class="t num">${st.ultima.s.toFixed(1)} s · ${st.ultima.toques} toques</span></div>` : '';
  let hoja = '';
  if (st.paso === 'quien') hoja = `<div class="velo" data-a="cancelar"></div><div class="hoja abajo"><h3>${r[3]}</h3><p>${r[4] ? 'Luego, cuánto avanzó.' : 'Un toque y se guarda.'}</p>
    <div class="pjs">${JUG.map(([id, n, i]) => `<button class="pj" data-a="quien" data-v="${id}"><span class="ini">${i}</span>${n}</button>`).join('')}<button class="pj" data-a="quien" data-v=""><span class="ini">?</span>No sé</button></div>
    <button class="cerrar" data-a="cancelar">Cancelar</button></div>`;
  if (st.paso === 'castigo') hoja = `<div class="velo" data-a="cancelar"></div><div class="hoja abajo"><h3>Castigo</h3><p>En tochito son 5 yardas.</p><div class="pjs" style="grid-template-columns:1fr 1fr"><button class="pj" data-a="castigo" data-v="favor" style="padding:18px 4px"><b style="font:italic 900 30px/1 var(--disp)">+5</b>A favor</button><button class="pj" data-a="castigo" data-v="contra" style="padding:18px 4px"><b style="font:italic 900 30px/1 var(--disp)">−5</b>En contra</button></div><button class="cerrar" data-a="cancelar">Cancelar</button></div>`;
  if (st.paso === 'cuanto') hoja = `${st.h === 'abajo' ? '<div class="velo" data-a="sinyd"></div>' : ''}<div class="hoja ${st.h}"><h3>¿Cuánto avanzó?<small>${st.pend.txt}</small></h3>
    <div style="margin-top:14px" id="brs">${barras(st.yd, st.v)}</div>
    <div class="sel v${st.v}" id="sel"><div class="pm"><button class="pmb" data-pm="-1" aria-label="Una yarda menos">−</button><div class="val num" id="val">${fmt(st.yd)}<small>yd</small></div><button class="pmb" data-pm="1" aria-label="Una yarda más">+</button></div>${tiraH()}</div>
    <button class="sinyd" data-a="sinyd">Sin yardas</button></div>`;
  $('#tel').innerHTML = `<div class="pant">
    <div class="mcab"><div class="fila"><div class="marc"><img src="${LOGO}" alt=""><span class="num">${st.nos}</span></div><span class="vs">vs BUC</span><div class="marc"><span class="num">0</span><img src="${RIVAL}" alt=""></div></div>
      <div class="vrs"><div class="grupo">${VARS.map((x) => `<button data-a="var" data-v="${x.k}" class="${st.v === x.k ? 'on' : ''}">${x.k}</button>`).join('')}</div>
      <div class="dir"><button data-a="hoja" data-v="abajo" class="${st.h === 'abajo' ? 'on' : ''}" aria-label="¿Cuánto? desde abajo">↥</button><button data-a="hoja" data-v="arriba" class="${st.h === 'arriba' ? 'on' : ''}" aria-label="¿Cuánto? desde arriba">↧</button></div></div></div>
    <div class="cuerpo">${dic}<div class="serie">${barras(0, st.v)}${st.aviso ? `<div class="aviso">${st.aviso}</div>` : ''}</div>
      <div class="pregunta">¿Qué pasó?</div>
      <div class="tiras">${RES.map(([k, t, p]) => `<button class="tira${k === 'td' ? ' td' : ''}" data-a="res" data-v="${k}"><svg viewBox="0 0 24 24">${ICO[k]}</svg><b>${t}</b><small>${p}</small></button>`).join('')}</div>
      ${u}
    </div>${hoja}
  </div>`;
  if (st.paso === 'cuanto') {
    const sel = $('#sel');
    sel.addEventListener('pointerdown', () => { st.toques++; clearTimeout(tG); });
    montar(sel);
  }
  notas();
}

// ---------- la jugada: la primera sale sola de las yardas ----------
function avanzar(yd, k, pide) {
  if (k === 'td') { st.nos += 6; nuevaSerie(); st.aviso = 'Touchdown'; return; }
  if (k === 'int') { nuevaSerie(); st.aviso = 'Cambio de posesión'; return; }
  if (pide && yd == null) st.incierto = true; // se saltaron las yardas: ya no se sabe dónde va el balón
  if (k === 'favor') yd = 5;
  if (k === 'contra') yd = -5;
  st.spot = Math.max(1, Math.min(CAMPO - 1, st.spot + (yd || 0)));
  if (!st.incierto && !st.primera && st.spot >= PRIMERA) { st.primera = true; st.down = 1; st.auto += 1; st.aviso = '¡Primera!'; return; }
  if (k === 'favor') return;
  st.down += 1;
  if (st.incierto) st.aviso = 'Sin yardas: no sé si ya es primera';
  if (st.down > 4) { nuevaSerie(); st.aviso = 'Cambio de posesión'; }
}
function nuevaSerie() { st.spot = 5; st.ini = 5; st.down = 1; st.incierto = false; st.primera = false; }
function terminar(yd) {
  const p = st.pend; if (!p) return; clearTimeout(tG);
  const s = (performance.now() - st.t0) / 1000;
  p.e.s = +s.toFixed(2); p.e.toques = st.toques; p.e.yd = yd; p.e.conYd = yd != null && p.pide;
  if (p.d) p.e.err = p.d[2] == null || yd == null ? null : Math.abs(yd - p.d[2]);
  st.ultima = { txt: p.txt + (yd != null && p.pide ? ` · ${fmt(yd)} yd` : ''), s, toques: st.toques };
  avanzar(yd, p.e.k, p.pide);
  poner('log', st.log);
  st.pend = null; st.paso = null; st.yd = 0;
}
const A = {
  var: (v) => { st.v = v; poner('v', v); },
  hoja: (v) => { st.h = v; poner('h', v); },
  res: (v) => {
    if (st.paso === 'cuanto') terminar(st.yd || null); // tocar la siguiente jugada cierra «¿Cuánto?» sin costar un toque
    st.sel = v; st.paso = v === 'castigo' ? 'castigo' : 'quien'; st.t0 = performance.now(); st.toques = 1; st.aviso = null;
  },
  cancelar: () => { st.paso = null; st.sel = null; },
  quien: (id) => {
    st.toques++;
    const r = RES.find((x) => x[0] === st.sel), d = st.dic != null ? DICTADO[st.dic] : null;
    const txt = `${r[1].toLowerCase()}${id ? ' · ' + NOM[id] : ''}`;
    const e = { v: st.v, h: st.h, k: st.sel, yd: null, s: 0, toques: 0, dic: !!d, err: null, conYd: false };
    st.log.unshift(e); st.log = st.log.slice(0, 600);
    st.pend = { e, txt, d, pide: r[4] };
    if (st.dic != null) st.dic = st.dic + 1 < DICTADO.length ? st.dic + 1 : null;
    if (st.sel === 'td') { terminar(CAMPO - st.spot); return; }
    if (!r[4]) { terminar(null); return; }
    st.paso = 'cuanto'; st.yd = 0;
  },
  castigo: (v) => {
    st.toques++;
    const e = { v: st.v, h: st.h, k: 'castigo', yd: v === 'favor' ? 5 : -5, s: +((performance.now() - st.t0) / 1000).toFixed(2), toques: st.toques, dic: false, err: null, conYd: false };
    st.log.unshift(e); poner('log', st.log);
    st.ultima = { txt: `castigo ${v === 'favor' ? 'a favor · +5' : 'en contra · −5'}`, s: e.s, toques: st.toques };
    avanzar(null, v, false); st.paso = null; st.sel = null;
  },
  sinyd: () => { clearTimeout(tG); st.toques++; terminar(null); },
  dictar: () => { st.dic = 0; st.paso = null; nuevaSerie(); st.aviso = null; },
  borrar: () => { st.log = []; poner('log', st.log); st.ultima = null; },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || !A[b.dataset.a]) return;
  e.preventDefault();
  A[b.dataset.a](b.dataset.v);
  pintar();
});

// ---------- números ----------
const media = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
function notas() {
  const pide = (x) => (RES.find((r) => r[0] === x.k) || [])[4];
  const sinT = media(st.log.filter((x) => x.toques && !pide(x) && x.k !== 'castigo').map((x) => x.s));
  const filas = VARS.map((V) => {
    const l = st.log.filter((x) => x.v === V.k && x.toques), con = l.filter((x) => pide(x) && x.conYd);
    const tc = media(con.map((x) => x.s)), qc = media(con.map((x) => x.toques)), em = media(l.filter((x) => x.dic && x.err != null).map((x) => x.err));
    return `<tr><td><b>${V.k}</b> ${V.n}</td><td class="num">${con.length}</td><td class="num">${tc != null ? tc.toFixed(1) : '—'}</td><td class="num">${qc != null ? qc.toFixed(1) : '—'}</td>
      <td class="num">${qc != null ? 88 + Math.round((qc - 2) * 11) : '—'}</td><td class="num">${tc != null && sinT != null ? '+' + Math.round(Math.max(0, tc - sinT) * 11) + ' s' : '—'}</td><td class="num">${em != null ? em.toFixed(1) + ' yd' : '—'}</td></tr>`;
  }).join('');
  $('#notas').innerHTML = `<h1>Prueba de yardas · vuelta 4</h1>
    <p>La 10 y la 1 en una sola: <b>número grande, más y menos grandes, y la barra</b>. La barra pinta lo que ya avanzó la serie en un color y lo de esta jugada en otro. Arriba, en vez de textos, solo barritas: cuánto falta para la primera o el TD y en qué oportunidad van.</p>
    <div class="leyenda"><span><i style="background:var(--hecho)"></i>Ya avanzado</span><span><i style="background:var(--ahora)"></i>Esta jugada</span><span><i style="background:var(--perdio)"></i>Perdió</span><span><i style="background:var(--navy);width:8px"></i>Oportunidad en que van</span></div>
    <ul>${VARS.map((V) => `<li><b>${V.k} · ${V.n}</b>: ${V.nota}</li>`).join('')}</ul>
    <p>Igual en las cuatro: primero <b>¿Quién?</b> y luego, sola, <b>¿Cuánto?</b>; más y menos de a una yarda (dejándolo apretado sigue sumando) o se desliza la barra; se guarda solo al soltar. «Sin yardas», o tocar la siguiente jugada, las salta. La primera sale sola al cruzar medio campo.</p>
    <h2>Medir</h2>
    <p>El cronómetro va del primer toque (qué pasó) al guardado. Para comparar parejo: el dictado, 8 jugadas iguales; hazlo una vez en cada versión.</p>
    <div class="botones"><button data-a="dictar">Empezar dictado (8 jugadas)</button><button class="sec" data-a="borrar">Borrar mediciones</button></div>
    <h2>Resultados</h2>
    <table class="tabla"><tr><th>Versión</th><th>Con yd</th><th>Seg. con yd</th><th>Toques con yd</th><th>Toques partido</th><th>+ seg. partido</th><th>Error dictado</th></tr>${filas}</table>
    <p style="color:var(--mut);font-size:12.5px">«Partido» = un partido típico (base 88 toques) con yardas en sus 11 jugadas que las piden; los TD las calculan solos. En esta sesión, ${st.auto} primera${st.auto === 1 ? '' : 's'} salió sola.</p>
    <h2>Últimas capturas</h2>
    <div class="log">${st.log.filter((x) => x.toques).slice(0, 30).map((x) => `<div><span>${x.v}</span><span>${(RES.find((r) => r[0] === x.k) || [0, x.k])[1]}${x.yd != null && pide(x) ? ' · ' + fmt(x.yd) + ' yd' : ''}</span><span class="num">${x.s.toFixed(1)} s · ${x.toques} t</span></div>`).join('') || '<div><span>Todavía nada</span></div>'}</div>
    <h2>Referencias (Mobbin)</h2>
    <p><a href="https://mobbin.com/screens/88b78f24-9b47-445f-b32c-5cc2a33c89d8" target="_blank" rel="noopener">BitePal · Servings ↗</a> (la de Iker: más, número, menos y la regla) · <a href="https://mobbin.com/screens/ae721844-8b39-4121-8308-9a12db28b326" target="_blank" rel="noopener">Cal AI · número grande con regla ↗</a></p>
    <p style="margin-top:14px"><a href="yardas-3.html">Vuelta 3 (las 10 reglas) ↗</a> · <a href="yardas-2.html">Vuelta 2 ↗</a> · <a href="yardas-1.html">Vuelta 1 ↗</a></p>`;
}
pintar();
</script>
