:root {
  --bg: #f3f5f8; --card: #fff; --ink: #0b1b33; --navy: #0d2347; --azul: #1d4f8f; --hielo: #5aaeff; --mut: #56647a; --tenue: #a3acb9; --linea: #e4e8ee; --ok: #16a05a;
  --sombra: 0 1px 2px rgba(11, 27, 51, .05), 0 6px 18px rgba(11, 27, 51, .07);
  --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --oro: linear-gradient(180deg, #ffe38c 0%, #f6b73c 55%, #dd8d16 100%);
  --plata: linear-gradient(180deg, #f1f4f8 0%, #c6cfda 60%, #9aa7b6 100%);
  --bronce: linear-gradient(180deg, #ffd9b5 0%, #d99257 60%, #a9602b 100%);
}
/* familias de gradiente: el marcador, el botón de Marcar, las tarjetas de jugador y el encabezado */
.tel {
  --grad: radial-gradient(120% 90% at 100% 0%, rgba(120,190,255,.85) 0%, rgba(120,190,255,0) 55%), linear-gradient(135deg, #0d2347 0%, #1d4f8f 62%, #3f8fe6 100%);
  --boton: linear-gradient(135deg, #0d2347 0%, #1d4f8f 55%, #5aaeff 100%);
  --anillo: conic-gradient(from 210deg, #0d2347, #5aaeff, #1d4f8f, #0d2347);
  --abajo: env(safe-area-inset-bottom, 0px);
  --navh: calc(64px + var(--abajo)); /* lo que tapa la barra de pestañas: la píldora (56), su aire y la zona segura */
  --brillo: radial-gradient(70% 55% at 50% -10%, rgba(90,174,255,.20), transparent 70%);
  --acento: #1d4f8f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.35 Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: #e6eaf0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
.corta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* la app llena el teléfono; en pantalla ancha va centrada, a ancho de teléfono */
.tel { width: 100%; max-width: 430px; height: 100dvh; margin: 0 auto; background: var(--bg); position: relative; overflow: hidden; }
.tel::before { content: ''; position: absolute; inset: 0 0 auto; height: 260px; background: var(--brillo); pointer-events: none; }
.conm { display: inline-flex; flex-wrap: wrap; background: #d9dfe8; border-radius: 10px; padding: 3px; margin: 7px 0 0; }
.conm button { padding: 8px 12px; border-radius: 8px; font: 600 13px/1 Inter; }
.conm button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (max-width: 520px) {
  /* encabezado B: la página es marina, así Safari 26 pinta de marino la franja de la hora en todas las pantallas;
     la barra de abajo va fija para que Safari tome su blanco en la orilla de abajo */
  html, body { background: var(--franja, #0d2347); }
  .tel { max-width: none; }
  .tel .nav { position: fixed; }
}

/* abierta desde el ícono del iPhone (iOS 26) (Mau, 16-nov): iOS pinta la orilla de la hora con el fondo de la página, así que va
   marino (blanco = blur claro sobre el título); la barra lleva aire abajo para que los nombres no queden pegados a la rayita.
   Antes se adivinaba si iOS «cortaba» la app por la altura y entonces iba blanco y sin aire, pero en el iPhone de Mau la altura
   engaña con la pantalla completa y salía la niebla (16-nov tarde): ya no se adivina. */
html.app .tel { --abajo: max(20px, env(safe-area-inset-bottom)); --navh: calc(50px + var(--abajo)); }
/* la píldora 14 px más abajo (Iker, 17-nov): en un iPhone con rayita queda a 28 px de la orilla, encima de la rayita (que llega a 13) */
html.app .nav { padding-bottom: calc(var(--abajo) - 6px); }
html.app, html.app body { background: var(--franja, #0d2347); }
/* iOS 26 a veces le da a la página la pantalla menos la franja de la hora (793 de 852 en el iPhone 15) y el fondo azul se asoma abajo (Iker, 17-nov).
   Hacer la app más alta no sirve: WebKit no pinta nada fijo más allá de esa orilla y la barra sale cortada (lo que salió con el PR 16).
   iOS solo la acorta mientras la página es más chica que la pantalla (WebKit 301108): la página mide la ventana más la franja (sin pasar
   de la pantalla) y iOS le da la pantalla entera. La app va fija a la ventana: la barra nunca queda fuera de lo que se pinta y nada se arrastra */
html.app { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
html.app .tel { position: fixed; inset: 0; height: auto; }
/* iOS 26 difumina lo que queda bajo la hora hasta ~90 pt del borde: el encabezado baja 24 pt para que el logo y el título salgan nítidos (Mau, 16-nov).
   También en Marcar: con QB y Terminar pegados a la hora salían borrosos (Iker, 17-nov) */
html.app .estado { height: calc(env(safe-area-inset-top) + 24px); }
/* arriba (Mau, 15-nov): el título va en blanco sobre el marino de la hora; así no se deslava bajo la hora y el contenido sube */
.cab + h2 { margin-top: 10px; }

/* ---------- piezas de la app ---------- */
.pant { position: absolute; inset: 0; display: flex; flex-direction: column; }
.cuerpo { flex: 1; overflow-y: auto; padding: 0 20px 124px; position: relative; }
/* la franja marina detrás de la hora de verdad (con black-translucent mide lo que la zona segura de arriba; en Safari, 14 px) */
.estado { height: max(14px, env(safe-area-inset-top)); flex: none; position: relative; }
.pant > .estado { background: #0d2347; }
/* la franja va dentro de lo que se desplaza: al bajar se va con el encabezado y no queda una barra marina pegada arriba (Iker, 17-nov) */
.cuerpo > .estado { margin: 0 -20px; background: #0d2347; }
/* desde el ícono la hora va en blanco: un velo marino suave, sin orilla, la deja leer cuando la lista pasa por debajo */
html.app .pant:has(> .cuerpo > .estado)::before { content: ''; position: absolute; inset: 0 0 auto; z-index: 4; height: calc(env(safe-area-inset-top) + 16px); background: linear-gradient(rgba(13,35,71,.62), rgba(13,35,71,.3) 55%, rgba(13,35,71,0)); pointer-events: none; }
.cab { display: flex; align-items: center; gap: 10px; margin: 0 -20px 14px; padding: 2px 22px 14px; background: #0d2347; color: #fff; }
.cab img { width: 38px; height: 38px; object-fit: contain; }
.cab b { font: 800 20px/1 Inter; }
.cab small { display: block; color: rgba(255,255,255,.72); font: 500 13px/1.2 Inter; margin-top: 3px; }
h2 { font: 800 15px/1.2 Inter; margin: 32px 2px 12px; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
h2 small { font: 600 12.5px/1 Inter; color: var(--mut); }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--sombra); }

/* retratos: siempre en círculo, con anillo de la familia de gradiente */
/* el rostro va solo, recortado en círculo, sin aro (decisión de Iker) */
.foto { position: relative; flex: none; display: block; border-radius: 50%; }
.foto > span { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #fff; }
.foto svg, .foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* los retratos son de 725 × 900 con la cabeza arriba: el círculo toma la parte de arriba para no cortarles el pelo (Iker, 17-nov).
   Todos vienen reencuadrados igual: cara del mismo tamaño y ojos a la misma altura (y 309), para que nadie se vea más grande ni más alto */
.foto img { object-position: 50% 0; }
.foto .ini { display: grid; place-items: center; height: 100%; background: #e8eef7; color: var(--navy); font: 800 13px/1 Inter; }
.pila { display: flex; align-items: center; }
.pila .foto { width: 34px; height: 34px; margin-left: -9px; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.pila .foto:first-child { margin-left: 0; }
.pila .mas { margin-left: -9px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--navy); display: grid; place-items: center; font: 800 12px/1 Inter; box-shadow: 0 0 0 2px rgba(255,255,255,.9); text-shadow: none; }

/* logos de los rivales: el que nos manden, o sus letras si todavía no hay logo */
.rlogo { display: inline-block; flex: none; position: relative; }
.rlogo svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
.rlogo { width: 40px; height: 40px; }
.rlogo img { position: absolute; left: 50%; top: 50%; width: calc(100% * var(--k, 1)); height: calc(100% * var(--k, 1)); transform: translate(-50%, -50%); object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
.heroe .eq .rlogo img, .mscore .rlogo img, .gigante .marc .rlogo img { width: calc(100% * var(--kv, 1)); height: calc(100% * var(--kv, 1)); }

/* ICONOS-CSS-INICIO: un ícono por tipo de jugada, en dos estilos */
.ic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; }
.ic svg { width: 26px; height: 26px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ic.linea { background: color-mix(in srgb, var(--c) 12%, #fff); }
.ic.linea svg { stroke: var(--c); stroke-width: 1.9; }
.ic.relleno { background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.06); }
.ic.relleno svg { stroke: #fff; stroke-width: 2.7; }
.ic.relleno svg .f { fill: rgba(255,255,255,.95); stroke: none; }
.ic.linea svg .f { fill: color-mix(in srgb, var(--c) 30%, transparent); stroke: none; }
.ic.chico { width: 30px; height: 30px; border-radius: 9px; }
.ic.chico svg { width: 19px; height: 19px; }
.res.td .ic.linea, .res.tdr .ic.linea { background: rgba(255,255,255,.18); }
.res.td .ic.linea svg, .res.tdr .ic.linea svg { stroke: #fff; }
.res.td .ic.relleno, .res.tdr .ic.relleno { background: #fff; }
.res.td .ic.relleno svg { stroke: #1d4f8f; } .res.tdr .ic.relleno svg { stroke: #4b5563; }
.res.td .ic.relleno svg .f { fill: #1d4f8f; } .res.tdr .ic.relleno svg .f { fill: #4b5563; }
.jlista { margin-top: 20px; background: #fff; border-radius: 16px; box-shadow: var(--sombra); }
.jlista h4 { margin: 0; padding: 12px 14px 4px; font: 800 13px/1 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }
.jlista h4 button { font: 700 13px/1 Inter; color: var(--acento); text-transform: none; letter-spacing: 0; }
.jfila { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--linea); font-size: 14px; }
.jfila:first-of-type { border-top: 0; }
.jfila > .corta { flex: 1; min-width: 0; }
.jfila .ic { flex: none; }
.jfila small { color: var(--mut); font: 600 12px/1 Inter; flex: none; }
button.jfila { width: 100%; text-align: left; }
.jfila .otro { color: var(--acento); }
/* el castigo en una sola tira, partida a favor y en contra */
.castigo2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.res.mitad { min-height: 58px; padding: 10px 14px; grid-template-columns: minmax(0, 1fr); }
.res.mitad small { margin: 0 0 3px; }
.res.mitad b { font-size: 14.5px; }
/* la conversión en una hoja: entró a la izquierda, no entró a la derecha */
.convf .cf { display: grid; grid-template-columns: 86px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.convf .cn { font: 800 15px/1.15 Inter; }
.convf .cn small { display: block; color: var(--mut); font: 600 12px/1.2 Inter; margin-top: 2px; }
.convf .op { height: 56px; }
.hoja h4.sub { margin: 16px 2px 8px; font: 800 12.5px/1 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.hoja .pjs.chicos .pj { min-height: 90px; }
.hoja .ops.acc .op { height: 48px; font-size: 15px; }
.hoja .op.borrar, .op.borrar { color: #c0392b; }
.cuerpo > .ops.acc .op { height: 48px; font-size: 15px; background: #fff; box-shadow: var(--sombra); }
input.nombre { flex: 1; min-width: 0; height: 44px; border: 1.5px solid var(--linea); border-radius: 12px; padding: 0 12px; font: 700 16px/1 Inter; color: var(--ink); background: #fff; outline: none; -webkit-appearance: none; }
input.nombre:focus { border-color: var(--acento); }
.pj.actual, .op.actual { box-shadow: inset 0 0 0 2.5px var(--acento); }
.mbar .qbchip { margin: 0; height: 38px; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* «¿Cuánto avanzó?»: la regla que escogió Iker en el editor; sin velo, las tiras de arriba siguen tocables */
.hoja.cuanto { padding: 8px 16px calc(14px + var(--abajo)); box-shadow: 0 -10px 30px rgba(11,27,51,.18); }
.mscore .down .op1 { font: italic 900 24px/1 var(--disp); }
.rg-pmf { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; align-items: center; gap: 8px; margin-top: 2px; }
.rg-b { width: 70px; height: 70px; border-radius: 50%; background: #eceef1; color: var(--navy); display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.rg-b svg { display: block; }
.rg-vw { position: relative; text-align: center; min-width: 0; white-space: nowrap; }
.rg-v { display: inline-block; font: italic 900 100px/96px var(--disp); color: var(--ink); transition: color .15s; }
.rg-v small { font: 700 15px/1 Inter; font-style: normal; color: var(--mut); margin-left: 4px; }
.rg-v.tic { animation: rgTic .18s ease-out; }
.rg-anuncio { position: absolute; z-index: 5; left: 50%; bottom: -24px; transform: translate(-50%, 0); background: #f6c90e; color: #3a2c00; font: 900 12px/1 Inter; padding: 6px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .15s, transform .2s; pointer-events: none; }
.rg-anuncio.ver { opacity: 1; transform: translate(-50%, 2px); }
.rg-env { position: relative; height: 84px; margin-top: 10px; }
.rg-th { position: relative; height: 84px; overflow-x: scroll; scrollbar-width: none; scroll-snap-type: x mandatory; -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent); touch-action: pan-x; cursor: grab; }
.rg-th::-webkit-scrollbar { display: none; }
.rg-p { position: relative; height: 100%; }
.rg-mm { position: absolute; top: 0; bottom: 0; }
.rg-s { position: absolute; top: 0; height: 100%; width: 1px; scroll-snap-align: center; }
.rg-m { position: absolute; border-radius: 3px; background: #d6dce5; }
.rg-n { position: absolute; transform: translateX(-50%); color: var(--mut); font: 700 12px/1 Inter; }
.rg-z { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.rg-pm { position: absolute; width: 3px; margin-left: -1.5px; background: #f6c90e; border-radius: 2px; box-shadow: 0 0 6px rgba(246,201,14,.6); }
.rg-ag { position: absolute; left: 50%; top: 0; width: 5px; margin-left: -2.5px; border-radius: 3px; background: var(--navy); pointer-events: none; z-index: 3; }
.rg-ag.rebote, .rg-v.rebote { animation: rgRebote .3s cubic-bezier(.3,1.7,.5,1); }
@keyframes rgTic { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes rgRebote { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
/* Equipo al final de un partido: franja de 3 y «Ver todos los números» (la limpieza, aprobada por Iker) */
.franja3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.franja3 > div { padding: 16px 6px 14px; border-left: 1px solid var(--linea); } .franja3 > div:first-child { border-left: 0; }
.franja3 span { display: block; font: 600 12px/1.2 Inter; color: var(--mut); } .franja3 strong { display: block; font: italic 900 38px/1 var(--disp); margin-top: 6px; }
details.mas > summary { list-style: none; cursor: pointer; font: 700 13.5px/1 Inter; color: var(--acento); padding: 15px 16px; border-top: 1px solid var(--linea); text-align: center; }
details.mas > summary::-webkit-details-marker { display: none; }
details.mas[open] > summary { color: var(--mut); }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--linea); }
.mrow b { display: block; font: 700 14px/1.2 Inter; } .mrow small { color: var(--mut); font: 500 12px/1.3 Inter; }
.mrow strong { font: italic 900 30px/1 var(--disp); flex: none; } .mrow strong i { font: 700 14px/1 Inter; color: var(--mut); margin-left: 2px; }
/* los números de cada quien: columnas de ancho fijo, título y cifra en el mismo eje, cifras tabulares */
.tbs { margin-bottom: 12px; padding: 2px 0 6px; overflow: hidden; }
table.bs { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.bs th { font: 700 11px/1 Inter; letter-spacing: .04em; text-transform: uppercase; color: var(--mut); text-align: center; padding: 12px 0 8px; white-space: nowrap; }
table.bs th:first-child { text-align: left; padding-left: 14px; font: 800 13.5px/1.15 Inter; color: var(--navy); letter-spacing: 0; text-transform: none; }
table.bs td { text-align: center; padding: 7px 0; font: 600 14px/1.2 Inter; font-variant-numeric: tabular-nums; border-top: 1px solid var(--linea); white-space: nowrap; }
table.bs td:first-child { text-align: left; padding-left: 14px; }
table.bs th:last-child, table.bs td:last-child { padding-right: 8px; }
table.bs td.v { color: #b8c2cf; }
.nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nm .foto { width: 28px; height: 28px; }
.nm b { font: 600 14px/1.2 Inter; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.relevo { margin-top: 12px; background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.4; color: var(--mut); }
.relevo b { color: var(--ink); }
.convs .op { display: flex; align-items: center; justify-content: center; gap: 10px; }
.convs .op .ic.relleno { background: #fff; } .convs .op .ic.relleno svg { stroke: var(--c); } .convs .op .ic.relleno svg .f { fill: var(--c); }
.convs .op .ic.linea { background: rgba(255,255,255,.2); } .convs .op .ic.linea svg { stroke: #fff; }
/* ICONOS-CSS-FIN */

/* ANIM-INICIO: confirmación al marcar (no bloquea: nada atrapa el dedo) */
.tel.anim .mscore strong.sube { animation: bump .3s cubic-bezier(.3,1.6,.5,1); display: inline-block; }
.confeti { position: absolute; left: 50%; top: 150px; width: 0; height: 0; z-index: 20; pointer-events: none; }
.confeti i { position: absolute; width: 9px; height: 14px; border-radius: 2px; background: var(--k); opacity: 0; animation: chispa .75s cubic-bezier(.2,.7,.4,1) forwards; animation-delay: var(--d); }
.tdflash { position: absolute; inset: 0; z-index: 19; pointer-events: none; background: radial-gradient(60% 40% at 50% 22%, rgba(90,174,255,.32), transparent 70%); opacity: 0; animation: destello .6s ease-out; }
@keyframes toastIn { from { transform: translateY(-14px) scale(.96); opacity: 0; } }
@keyframes icPop { from { transform: scale(.5) rotate(-12deg); } }
@keyframes anillo { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
@keyframes bump { 40% { transform: scale(1.28); } }
@keyframes chispa { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
@keyframes destello { 30% { opacity: 1; } }
/* ANIM-FIN */
.rlogo.sin { border-radius: 50%; background: linear-gradient(135deg, #4b5563, #9ca3af); color: #fff; display: grid; place-items: center; font: 800 12px/1 Inter; letter-spacing: .02em; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); }

/* héroe del partido (Inicio 1): se queda como en la ronda 4 */
.heroe { border-radius: 22px; background: var(--grad); color: #fff; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 12px 28px rgba(13,35,71,.26); }
.heroe, .gigante, .mcab { text-shadow: 0 1px 3px rgba(5,15,35,.35); }
.btn-blanco, .gigante .tocar span { text-shadow: none; }
.heroe .balon { position: absolute; right: -30px; top: -14px; width: 150px; transform: rotate(-12deg); filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); pointer-events: none; }
.heroe .eti { font: 700 12px/1 Inter; letter-spacing: .08em; text-transform: uppercase; opacity: .9; display: flex; align-items: center; gap: 7px; position: relative; }
.heroe .eti i { width: 8px; height: 8px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 0 3px rgba(255,90,90,.3); }
.heroe .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 14px 96px 12px 0; position: relative; }
.heroe .vs .mid strong { white-space: nowrap; }
/* el logo del rival 12 px a la derecha y el de Belugas 8 px a la izquierda: ya no tocan la cifra; el balón no se mueve */
.heroe .vs .eq:first-child { transform: translateX(-8px); } .heroe .vs .eq:last-child { transform: translateX(12px); }
.heroe .eq { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 13px/1 Inter; }
.heroe .eq img, .heroe .eq .rlogo { width: 54px; height: 54px; }
.heroe .mid { text-align: center; }
.heroe .mid strong { font: italic 900 48px/1 var(--disp); letter-spacing: -.01em; text-shadow: 0 2px 10px rgba(0,0,0,.2); }
.heroe .mid small { display: block; font: 600 13px/1.3 Inter; opacity: .9; margin-top: 4px; }
.btn-blanco { width: 100%; height: 60px; border-radius: 14px; background: #fff; color: var(--navy); font: 800 18px/1 Inter; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 0 rgba(0,0,0,.08); position: relative; }
.btn-blanco:active, .gigante:active, .res:active, .pj:active, .op:active, .cat:active { transform: scale(.98); }


/* último y próximo partido */
.pmini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pm { display: flex; align-items: center; gap: 10px; padding: 12px; text-align: left; width: 100%; min-width: 0; }
.pm .rlogo { width: 40px; height: 40px; }
.pm small { display: block; font: 700 10.5px/1.2 Inter; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }
.pm b { display: block; font: 700 14px/1.2 Inter; }
.pm .sc { font: italic 900 22px/1 var(--disp); color: var(--navy); }
.pm .g { color: var(--ok); }

/* ---------- líderes ---------- */
.cats { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
.cat { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); font: 700 13px/1 Inter; color: var(--mut); }
.cat.on { background: var(--boton); color: #fff; box-shadow: 0 3px 0 rgba(13,35,71,.25); }
.lideres { background: #fff; border-radius: 22px; box-shadow: var(--sombra); overflow: hidden; }
.corona { position: relative; z-index: 3; display: block; pointer-events: none; filter: drop-shadow(0 4px 5px rgba(160,100,0,.35)); }
.valor { font: italic 900 24px/1 var(--disp); color: var(--navy); }
.valor small { font: 700 11px/1 Inter; font-style: normal; color: var(--mut); margin-left: 2px; }
.desg { display: block; margin-top: 3px; font: 600 11px/1.35 Inter; color: var(--mut); }
.desg span { display: block; white-space: nowrap; }
.desg em { font: 800 11px/1 Inter; font-style: normal; color: var(--navy); }
.tfila .desg span { display: inline; }
.tfila .desg span + span::before { content: ' · '; }

/* versión 1: escalones */
.podio { display: grid; grid-template-columns: 1fr 1.18fr 1fr; align-items: end; gap: 8px; padding: 16px 12px 0; background: linear-gradient(180deg, #f6f9ff, #fff 70%); }
.pcol { display: flex; flex-direction: column; align-items: center; min-width: 0; text-align: center; }
.pcol .foto { width: 64px; height: 64px; box-shadow: 0 8px 16px rgba(13,35,71,.18); }
.pcol.p1 .foto { width: 86px; height: 86px; }
.pcol .corona { width: 62px; margin-bottom: -16px; }
.pcol b { display: block; max-width: 100%; font: 800 13.5px/1.2 Inter; margin-top: 7px; }
.pcol .valor { margin-top: 2px; }
.escalon { width: 100%; margin-top: 8px; border-radius: 14px 14px 0 0; display: grid; justify-items: center; align-content: start; padding-top: 8px; font: italic 900 36px/1 var(--disp); box-shadow: inset 0 5px 0 rgba(255,255,255,.35); }
.p1 .escalon { height: 104px; background: var(--grad); color: #fff; }
.p2 .escalon { height: 78px; background: var(--plata); color: #5b6676; }
.p3 .escalon { height: 60px; background: var(--bronce); color: #7a431b; }


/* la tabla de abajo, compacta */
.tabla { border-top: 1px solid var(--linea); }
.tfila { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--linea); }
.tfila:last-child { border-bottom: 0; }
.tfila .rk { width: 20px; flex: none; text-align: center; font: 800 14px/1 Inter; color: var(--mut); }
.tfila .foto { width: 34px; height: 34px; }
.tfila > div { flex: 1; min-width: 0; }
.tfila b { display: block; font: 700 14px/1.2 Inter; }
.tfila small { color: var(--mut); font-size: 12px; }
.tfila .valor { font-size: 20px; flex: none; }
.vertodos { width: 100%; height: 48px; font: 700 14px/1 Inter; color: var(--acento); border-top: 1px solid var(--linea); }

/* entrada juguetona (no corre si el teléfono pide menos movimiento) */
.entra .escalon { transform-origin: bottom; animation: crece .3s cubic-bezier(.3,1.35,.5,1) both; }
.entra .p3 .escalon { animation-delay: 0s; } .entra .p2 .escalon { animation-delay: .04s; } .entra .p1 .escalon { animation-delay: .08s; }
.entra .pcol .foto, .entra .med .aro, .entra .sub, .entra .respaldo { animation: pop .25s cubic-bezier(.3,1.6,.5,1) both; }
.entra .p3 .foto, .entra .m3 .aro { animation-delay: .1s; } .entra .p2 .foto, .entra .m2 .aro { animation-delay: .13s; } .entra .p1 .foto, .entra .m1 .aro, .entra .respaldo { animation-delay: .16s; }
.entra .dos .sub:first-child { animation-delay: .18s; } .entra .dos .sub:last-child { animation-delay: .2s; }
.entra .corona { animation: cae .25s cubic-bezier(.3,1.5,.5,1) .2s both; }
.entra .tfila { animation: sube .25s ease-out both; }
.entra .tfila:nth-child(2) { animation-delay: .03s; } .entra .tfila:nth-child(3) { animation-delay: .06s; } .entra .tfila:nth-child(4) { animation-delay: .09s; }
@keyframes crece { from { transform: scaleY(0); } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes cae { from { transform: translateY(-46px) rotate(-24deg); opacity: 0; } }
/* al cambiar de categoría las fotos no se mueven: solo aparecen los números (Iker, 17-nov: «las imágenes se recargan») */
.cambia .valor, .cambia .desg { animation: ap .25s ease-out; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.fila-j { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.fila-j .foto { width: 44px; height: 44px; }
.fila-j > div { flex: 1; }
.fila-j b { display: block; font: 700 15px/1.2 Inter; }
.fila-j small { color: var(--mut); font-size: 12.5px; }
.fila-j .dato { margin-left: auto; text-align: right; font: 600 12.5px/1.3 Inter; color: var(--mut); flex: none; }
.fila-j .dato strong { display: block; font: italic 900 22px/1 var(--disp); color: var(--navy); }

/* barra de abajo */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: var(--navh); padding: 0 14px calc(var(--abajo) + 8px); display: flex; align-items: flex-end; z-index: 5; pointer-events: none; }
/* en Safari (no desde el ícono) la franja de la barra va del fondo de la página, para que Safari pinte su barra de ese color y no de marino */
html:not(.app) .nav { background: var(--bg); }
/* la barra (Iker, 17-nov: la Waterline con «En vivo» de la A): una píldora de vidrio que flota, solo íconos; una gota de agua marca la
   pestaña, se estira hacia la que tocas, se parte en gotitas en los saltos largos y se junta con una onda (montaAgua) */
.agua { position: relative; flex: 1; display: flex; gap: 2px; padding: 5px; border-radius: 999px; isolation: isolate; pointer-events: auto; color: rgba(13,35,71,.66); }
/* vidrio limpio (Iker, 17-nov, la 1 de belugas-dock-limpio): blanco y transparente, sin arcoíris ni filos de color; los íconos apagados al 66 % (3:1 o más) */
.agua-vidrio { position: absolute; inset: 0; border-radius: inherit; z-index: -2; background: rgba(255,255,255,.6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.35), 0 10px 28px -14px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.06); }
.agua canvas { position: absolute; left: -14px; top: -14px; z-index: -1; pointer-events: none; }
.agua-gota { display: none; position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 999px; z-index: -1; pointer-events: none; will-change: transform, width;
  background: radial-gradient(120% 140% at 30% 0%, rgba(255,255,255,.75), rgba(255,255,255,0) 55%), rgba(255,255,255,.38);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.95), inset 0 -2px 6px rgba(0,162,255,.22), inset 0 0 0 1px rgba(255,255,255,.55), 0 6px 16px -6px rgba(0,70,140,.45); }
.agua[data-gl="off"] canvas { display: none; } .agua[data-gl="off"] .agua-gota { display: block; }
.nav button { position: relative; z-index: 1; flex: 1; height: 46px; border-radius: 999px; display: grid; place-items: center; transition: color .2s; }
.nav button.on, .nav .centro2 { color: var(--navy); }
.nav .nom { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nav svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nv-ico { position: relative; display: inline-flex; }
.nv-ico > * { transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.nav button.on .nv-ico > * { transform: translateY(-1px) scale(1.08); }
/* lo que hace cada ícono al tocarlo */
.tel.anim .nv-ico[data-fx="pop"] > * { animation: nvPop .3s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes nvPop { 0% { transform: scale(.72); } 60% { transform: scale(1.2); } 100% { transform: translateY(-1px) scale(1.08); } }
.tel.anim .nv-ico[data-fx="gota"] > * { animation: nvGota .3s cubic-bezier(.4,0,.3,1) both; transform-origin: 50% 100%; }
@keyframes nvGota { 26% { transform: translateY(-11px) scale(.9,1.1); } 46% { transform: translateY(3px) scale(1.25,.72); } 62% { transform: translateY(-3px) scale(.94,1.06); } 80% { transform: none; } 100% { transform: translateY(-1px) scale(1.08); } }
.tel.anim .nv-ico[data-fx="gira"] > * { animation: nvGira .3s cubic-bezier(.2,.75,.25,1) both; }
@keyframes nvGira { 0% { transform: perspective(80px) rotateY(0); } 100% { transform: perspective(80px) rotateY(360deg) translateY(-1px) scale(1.08); } }
.tel.anim .nv-ico[data-fx="brinca"] > * { animation: nvBrinca .3s cubic-bezier(.3,1.4,.5,1) both; transform-origin: 50% 100%; }
@keyframes nvBrinca { 30% { transform: translateY(-5px) scale(1.04,.96); } 55% { transform: scale(1.12,.88); } 75% { transform: translateY(-2px) scale(.98,1.04); } 100% { transform: translateY(-1px) scale(1.08); } }
.tel.anim .nv-ico[data-fx="saluda"] > * { animation: nvSaluda .3s ease-in-out both; transform-origin: 50% 92%; }
@keyframes nvSaluda { 20% { transform: rotate(-15deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(4deg); } 100% { transform: translateY(-1px) scale(1.08); } }
/* el botón del centro: una píldora con +; mientras hay partido, el marcador con el punto rojo de en vivo */
.nav .centro2 .pill { height: 25px; min-width: 44px; padding: 0 9px; border-radius: 13px; background: var(--boton); color: #fff; display: grid; place-items: center; position: relative; box-shadow: 0 3px 8px rgba(13,35,71,.22); }
.nav .centro2 .pill svg { width: 17px; height: 17px; stroke: #fff; stroke-width: 2.5; }
.nav .centro2.vivo .pill { font: italic 900 17px/1 var(--disp); letter-spacing: .01em; min-width: 50px; padding: 0 8px; }
.nav .centro2.vivo .pill::after { content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: #ff4d4f; box-shadow: 0 0 0 2px #fff; }
.nav .centro2.sin .pill::after { background: #ffb020; }
.tel.anim .nav .centro2.vivo .pill::after { animation: latido 1.8s ease-in-out infinite; }
@keyframes latido { 50% { transform: scale(.7); opacity: .6; } }

/* pantalla de marcar */
/* encabezado B: marino liso en la orilla de arriba (sigue detrás de la hora) y el brillo abajo a la derecha */
.mcab { background: radial-gradient(110% 130% at 100% 100%, rgba(120,190,255,.55) 0%, rgba(120,190,255,0) 60%), linear-gradient(180deg, #0d2347 0%, #0d2347 40%, #1d4f8f 100%); color: #fff; padding: 0 14px 12px; border-radius: 0 0 24px 24px; flex: none; position: relative; }
.mbar { display: flex; align-items: center; justify-content: space-between; height: 40px; }
.mbar button { height: 38px; min-width: 38px; padding: 0 13px; border-radius: 999px; background: rgba(6,18,40,.3); font: 700 13px/1 Inter; color: #fff; }
.mscore { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 6px; }
.mscore .eq { display: flex; align-items: center; gap: 10px; }
.mscore .eq.r2 { justify-content: flex-end; }
.mscore img, .mscore .rlogo { width: 40px; height: 40px; }
.mscore strong { font: italic 900 52px/1 var(--disp); }
.mscore .down { text-align: center; font: 700 13px/1.3 Inter; color: #fff; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.14); }
.mscore .down small { display: block; opacity: .85; font-weight: 500; }
.mscore .down .op1 { display: block; font: italic 900 22px/1 var(--disp); letter-spacing: .01em; white-space: nowrap; }
.qbchip { display: block; margin: 10px auto 0; height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font: 600 13px/1 Inter; }
.qbchip b { font-weight: 800; }
.ic.simple.bueno svg { stroke: #16a05a; } .ic.simple.malo svg { stroke: #e0483e; }
.lado { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); background: #e3e8ef; border-radius: 12px; padding: 4px; margin: 14px 0 4px; }
.lado button { height: 46px; border-radius: 9px; font: 700 15px/1 Inter; color: var(--mut); }
.lado button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
/* MARCAR (12-nov, ronda 6 opción 2 de Mau): marcador gigante; 4 grandes; los chicos y los castigos en un bloque; el TD hasta abajo.
   Sin títulos; la defensa no cambia de color. Al abrir se ve justo hasta el TD (en ataque); la última jugada y la lista quedan abajo.
   Medidas fijas: grande 3:2 (112 de alto), chico 52; 10 entre grandes, 8 entre chicos, 24 entre grupos. */
.mbar .qbchip { max-width: 40%; }
/* Ataque/Defensa (Iker, 17-nov): grande y arriba; el lado en que vas en blanco. Tocar el otro acaba la serie */
.mk-lado { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin: 8px 0 0; padding: 2px; border-radius: 11px; background: rgba(6,18,40,.3); }
.mk-lado button { height: 34px; border-radius: 9px; color: rgba(255,255,255,.8); font: 800 14px/1 Inter; }
.mk-lado button.on { background: #fff; color: var(--navy); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.mk-marc { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; color: #fff; }
.mk-marc strong { font: italic 900 62px/.95 var(--disp); letter-spacing: -.01em; text-shadow: 0 3px 14px rgba(0,0,0,.25); }
.mk-marc strong i { font-style: normal; opacity: .55; margin: 0 8px; }
.mk-marc strong span { display: inline-block; }
.tel.anim .mk-marc .sube { animation: bump .3s cubic-bezier(.3,1.6,.5,1); }
.mk-eq { display: grid; justify-items: center; gap: 4px; }
.mk-eq img, .mk-eq .rlogo { width: 36px; height: 36px; }
.mk-eq span { display: flex; align-items: center; gap: 5px; font: 800 12.5px/1 Inter; letter-spacing: .05em; text-transform: uppercase; opacity: .92; }
.mk-cuerpo { padding-top: 20px; padding-bottom: 0; display: flex; flex-direction: column; }
.mk-cuerpo::after { content: ''; flex: none; height: calc(var(--navh) + 14px); } /* el aire de abajo de .cuerpo: WebKit no cuenta el padding de una columna flex al bajar y lo último quedaba bajo la barra */
.mk-cuerpo > * { flex-shrink: 0; }
.mk-vista + .ultima { margin-top: 18px; } /* 12-nov: la última jugada va justo debajo del TD, sin hueco */
.mk-td { width: 100%; margin-top: 14px; height: 74px; border-radius: 18px; background: var(--boton); color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 18px; font: 800 21px/1 Inter; box-shadow: 0 8px 18px rgba(13,35,71,.25); }
/* en defensa el encabezado y el TD de ellos toman el color del rival (--rc, de EQUIPOS), en degradado como el nuestro */
.mcab.mk-def, .mk-td.riv { background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--rc) 55%, #fff 45%) 0%, transparent 55%), linear-gradient(135deg, color-mix(in srgb, var(--rc) 45%, #000) 0%, color-mix(in srgb, var(--rc) 80%, #000) 62%, var(--rc) 100%); }
.mk-td.riv { box-shadow: 0 8px 18px color-mix(in srgb, var(--rc) 35%, transparent); text-shadow: 0 1px 3px rgba(0,0,0,.35); }
.mcab.mk-def .mk-lado button.on { color: color-mix(in srgb, var(--rc) 70%, #000) !important; }
.pregunta { font: 800 22px/1.2 Inter; margin: 14px 2px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
/* el aviso de cada jugada va en este renglón y con la misma altura: el marcador queda a la vista y ninguna tira se mueve */
.pregunta.aviso { height: 40px; margin: 14px 0 10px; background: var(--ink); color: #fff; border-radius: 14px; padding: 0 2px 0 10px; font: 600 14px/1.2 Inter; gap: 6px; justify-content: flex-start; }
.tel.anim .pregunta.aviso.nuevo { animation: avisoIn .22s cubic-bezier(.3,1.4,.5,1); }
.pregunta.aviso > .foto { width: 28px; height: 28px; }
.pregunta.aviso .ic.simple svg { stroke: #fff; }
.pregunta.aviso .txt { flex: 1; min-width: 0; text-align: left; font: inherit; color: inherit; height: 40px; }
.pregunta.aviso .acc { color: #9fd0ff; font: 800 14px/1 Inter; height: 40px; padding: 0 8px; flex: none; }
.pregunta.aviso .cara { width: 30px; height: 40px; display: grid; place-items: center; flex: none; }
.pregunta.aviso.caras { gap: 4px; } .pregunta.aviso.caras .acc { padding: 0 6px; }
.pregunta.aviso .cara .foto { width: 28px; height: 28px; }
.pregunta.aviso .si { height: 30px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; font: 700 12.5px/1 Inter; flex: none; }
@keyframes avisoIn { from { transform: scale(.97); opacity: 0; } }
/* abajo del TD: el aviso de la jugada, o «Última · Corregir · Deshacer» si no hay aviso (mismo alto, nada brinca) */
.ultima { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--mut); padding: 0 2px; min-height: 44px; }
.ultima b { color: var(--ink); font-weight: 600; }
.ultima button { margin-left: auto; color: var(--acento); font: 700 13.5px/1 Inter; min-height: 44px; padding: 0 0 0 8px; flex: none; }
.ultima button + button { margin-left: 0; padding-left: 14px; border-left: 1px solid var(--linea); }
/* en Marcar el aviso sale arriba como pop-up, sobre el marcador, y se va solo: nunca abajo ni empujando los botones (Iker, 17-nov).
   Va bajo QB/Terminar/Listo para no quitarles el toque (la hora + los 40 de .mbar) */
.pant > .pregunta.aviso { position: absolute; left: 12px; right: 12px; top: calc(max(14px, env(safe-area-inset-top)) + 44px); margin: 0; height: 52px; z-index: 6; background: #04070e; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 14px 32px rgba(0,0,0,.4); }
.pant > .pregunta.aviso .acc { height: 52px; padding: 0 14px; font-size: 15px; }
.pant > .pregunta.aviso .txt { height: 52px; line-height: 52px; } /* el texto al centro del alto del aviso */
html.app .pant > .pregunta.aviso { top: calc(env(safe-area-inset-top) + 68px); }
.tel.anim .pant > .pregunta.aviso.nuevo { animation: toastIn .28s cubic-bezier(.3,1.4,.5,1); }
.pregunta .ult { min-height: 40px; padding: 0 2px 0 10px; font: 700 13.5px/1 Inter; color: var(--acento); flex: none; }
.pregunta .vista { display: inline-flex; background: #e3e8ef; border-radius: 9px; padding: 3px; flex: none; }
.pregunta .vista button { font: 700 11.5px/1 Inter; color: var(--mut); padding: 7px 9px; border-radius: 7px; }
.pregunta .vista button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res { background: #fff; border-radius: 16px; box-shadow: var(--sombra); min-height: 76px; padding: 12px; text-align: left; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; align-content: center; }
.res .ic { grid-row: span 2; }
.res b { font: 800 16px/1.15 Inter; }
.res small { color: var(--mut); font-size: 12px; margin-top: 3px; }
.res.td { grid-column: span 2; background: var(--boton); color: #fff; min-height: 76px; }
.res.td small { color: rgba(255,255,255,.88); }
.res.tdr { grid-column: span 2; background: linear-gradient(135deg, #374151, #6b7280 60%, #a3acb9); color: #fff; min-height: 76px; }
.res.tdr small { color: rgba(255,255,255,.88); }
.res.sec { grid-column: span 2; min-height: 54px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--linea); grid-template-columns: auto 1fr auto; }
.res.sec .ic { grid-row: auto; }
.res.sec small { margin-top: 0; }
/* tiras: una opción por renglón, a todo el ancho */
.grid.tiras { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.grid.tiras .res { min-height: 54px; padding: 8px 16px; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 14px; border-radius: 14px; }
.grid.tiras .res .ic { grid-row: auto; }
.grid.tiras .res b { font: 700 16px/1.2 Inter; }
.grid.tiras .res small { margin-top: 0; text-align: right; font-size: 12.5px; }
.grid.tiras .res.td, .grid.tiras .res.tdr { grid-column: auto; min-height: 58px; }
.grid.tiras .castigo2 { gap: 6px; }
.grid.tiras .res.mitad { min-height: 54px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 14px; }
.grid.tiras .res.mitad b { font: 700 15.5px/1.15 Inter; }
.grid.tiras .res.mitad small { margin: 0; text-align: left; font-size: 12px; line-height: 1.15; }
.grid.tiras .res.sec { min-height: 58px; grid-column: auto; }
/* la jugada en la lista: qué pasó y quién, y el marcador a la derecha */
.jfila .mk { flex: none; font: italic 900 17px/1 var(--disp); color: var(--navy); min-width: 44px; text-align: right; }
/* «Este partido» por series: de quién era el balón, cómo acabó, cuántas jugadas y el marcador; la serie en juego va abierta */
.serie { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-top: 1px solid var(--linea); }
.jlista h4 + .serie { border-top: 0; }
.serie.abierta { background: #f6f9fd; }
.serie .lt { flex: none; font: 800 11px/1 Inter; letter-spacing: .05em; text-transform: uppercase; padding: 5px 7px; border-radius: 7px; background: #e3e8ef; color: #374151; }
/* «Lo que pasó»: Ataque con el color de Belugas y Defensa con el del rival (Iker, 17-nov) */
.serie .lt.O { background: var(--navy); color: #fff; } .serie .lt.D { background: color-mix(in srgb, var(--rc) 78%, #000); color: #fff; }
.serie b { flex: 1; font: 700 14px/1.2 Inter; }
.serie small { flex: none; color: var(--mut); font: 600 12px/1 Inter; }
.serie .mk { flex: none; font: italic 900 17px/1 var(--disp); color: var(--navy); min-width: 44px; text-align: right; }
.serie i { flex: none; width: 10px; font-style: normal; color: var(--mut); font-size: 13px; }
.jlista .jfila.en { padding-left: 26px; }
.jfila.repe { background: #fff7e6; }
.repe-av { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px 26px; background: #fff7e6; font: 600 13px/1.3 Inter; color: #5b3b00; }
.repe-av span { flex: 1; }
.repe-av button { background: var(--ink); color: #fff; border-radius: 9px; height: 36px; padding: 0 12px; font: 800 13px/1 Inter; flex: none; }
/* uso-16: «Lo que marcamos» al terminar, ataque y defensa, solo con lo que se marca */
.lqm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lqm > div { background: #fff; border-radius: 16px; box-shadow: var(--sombra); padding: 12px 12px 4px; min-width: 0; }
.lqm h5 { margin: 0 0 8px; font: 800 12px/1 Inter; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.lqm .f { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 9px 0; border-top: 1px solid var(--linea); }
.lqm .f span { font: 600 12.5px/1.2 Inter; color: var(--mut); min-width: 0; }
.lqm .f b { font: italic 900 18px/1 var(--disp); color: var(--navy); white-space: nowrap; }
/* uso-07: arriba en el final, por si se tocó Terminar sin querer */
.sinquerer { margin: 12px 0 4px; display: flex; align-items: center; gap: 10px; background: #fff7e6; border-radius: 14px; padding: 6px 6px 6px 14px; font: 600 14px/1.25 Inter; color: #5b3b00; }
.sinquerer span { flex: 1; }
/* ajustes de Iker (17-nov): la pantalla no se jala ni rebota; la hoja que sigue abierta no se vuelve a animar */
* { overscroll-behavior: none; } /* ni arriba ni abajo, en ninguna pantalla: así nunca se asoma el fondo azul */
.hoja.quieta, .velo.quieta { animation: none; }
/* la palomita (Iker, 17-nov: «encontrar otra estrategia»): todo es un SVG con colores planos, nada de fondo ni degradado; al tocar, un pop */
.van-f.recien .ck { animation: pop .22s cubic-bezier(.3,1.6,.5,1); }
/* abajo del botón fijo ya no se asoman los renglones */
.hoja:has(> .ops.fijo) { padding-bottom: 0; }
/* Marcar (Iker, 17-nov): las 6 más usadas en botones grandes de solo texto, el TD y «Más opciones» con el resto; sin pestañas: «Lo que pasó» está a la derecha, se llega deslizando a la izquierda y los puntos dicen dónde vas */
.mk-tiras { display: grid; gap: 6px; }
.mk-grandes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.mk-grande { min-height: 98px; background: #fff; border-radius: 18px; box-shadow: var(--sombra); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px; padding: 12px 14px 13px; text-align: left; font: 800 19px/1.15 Inter; }
.mk-tira { gap: 12px; justify-content: flex-start; }
/* los botones grandes (la C de Iker, 17-nov: «más fácil de usar y de entender»): enteros del color de su jugada (--c, de ICONOS_C),
   oscurecido para que el blanco se lea al sol, con el glifo grande al centro y el nombre abajo */
.mk-grande { align-items: center; justify-content: center; text-align: center; gap: 8px; color: #fff; background: color-mix(in srgb, var(--c) 84%, #000); box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 30%, transparent); text-shadow: 0 1px 2px rgba(0,0,0,.28); }
/* «Profundo con brillo» (Iker, 17-nov): el mismo color, más profundo y menos saturado, en dos tonos cercanos, con filo de luz arriba
   y brillo en la esquina; el blanco queda en 4.8:1 o más (el ámbar de safety estaba en 3:1). Sin oklch relativo (iOS 17) queda el plano de arriba */
.mk-grande { position: relative; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,.22); background: linear-gradient(160deg, oklch(from var(--c) .54 calc(c * .78) h), oklch(from var(--c) .42 calc(c * .72) h));
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07), 0 8px 16px -4px color-mix(in srgb, var(--c) 45%, transparent); }
.mk-grande[data-v=incompleto] { background: linear-gradient(160deg, oklch(from var(--c) .53 calc(c * .9) h), oklch(from var(--c) .43 calc(c * .85) h)); }
.mk-grande::before { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 70% at 15% 0%, rgba(255,255,255,.16), transparent 60%); pointer-events: none; }
.mk-grande > span { position: relative; }
/* al tocar: se hunde, rebota y el filo de luz destella (~190 ms); con «reducir movimiento» solo se hunde */
.mk-grande::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 0 rgba(255,255,255,.85), inset 0 0 0 1.5px rgba(255,255,255,.5); opacity: 0; pointer-events: none; }
.mk-grande:active { transform: scale(.96); } .mk-grande:active::after { opacity: .6; }
.tel.anim .mk-grande.toque { animation: toque .19s ease-out; } .tel.anim .mk-grande.toque::after { animation: destello .19s ease-out; }
@keyframes toque { from { transform: scale(.95); } 55% { transform: scale(1.025); } }
@keyframes destello { from, 30% { opacity: 1; } to { opacity: 0; } }
.mk-grandes > .mk-grande:last-child:nth-child(odd) { grid-column: span 2; } /* sin «Nos pararon» quedan 5 en ataque: el último a todo lo ancho */
.mk-gi svg { display: block; width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; } .mk-gi svg .f { fill: #fff; stroke: none; }
.mk-td .ic.relleno { background: #fff; } .mk-td .ic.relleno svg { stroke: var(--navy); } .mk-td .ic.relleno svg .f { fill: var(--navy); }
.mk-td.riv .ic.relleno svg { stroke: color-mix(in srgb, var(--rc) 70%, #000); } .mk-td.riv .ic.relleno svg .f { fill: color-mix(in srgb, var(--rc) 70%, #000); }
.mk-td .ic.simple svg { stroke: #fff; }
.mk-tira { min-height: 56px; background: #fff; border-radius: 14px; box-shadow: var(--sombra); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 18px; text-align: left; font: 700 17px/1.2 Inter; }
.mk-tira small { color: var(--mut); font: 600 13px/1.2 Inter; }
.mk-tira.mas { background: transparent; box-shadow: inset 0 0 0 1.5px var(--linea); }
.hoja .mk-tira { background: var(--bg); box-shadow: none; }
.mk-tiras .mk-td { margin-top: 0; height: 60px; gap: 12px; }
.mk-tira:active, .mk-td:active { transform: scale(.98); }
.mk-puntos { display: flex; justify-content: center; margin: -15px 0 -1px; position: relative; }
.mk-puntos button { width: 26px; height: 16px; display: grid; place-items: center; }
.mk-puntos button::after { content: ''; width: 6px; height: 6px; border-radius: 3px; background: var(--linea); }
/* el punto de dónde vas se desliza con la página (--p: 0 Marcar, 1 Lo que pasó; --p0: de dónde viene) */
.mk-puntos i { position: absolute; left: 50%; top: 5px; width: 14px; height: 6px; margin-left: -20px; border-radius: 3px; background: var(--navy); transform: translateX(calc(var(--p) * 26px)); pointer-events: none; }
.mk-puntos i.mueve { animation: punto .3s cubic-bezier(.3,1.4,.5,1); }
@keyframes punto { from { transform: translateX(calc(var(--p0) * 26px)); } }
/* Marcar ↔ Lo que pasó (Iker, 17-nov): la página sigue al dedo, entra con un resorte y las series de Lo que pasó llegan escalonadas */
.mk-cuerpo { touch-action: pan-y; }
.mk-pag[data-entra] { animation: desliza .3s cubic-bezier(.22,1.2,.36,1); }
@keyframes desliza { from { transform: translateX(var(--dx)); opacity: 0; } }
.mk-pag[data-entra] .jlista > * { animation: jentra .22s cubic-bezier(.2,.9,.3,1) both; animation-delay: 145ms; }
.mk-pag[data-entra] .jlista > :nth-child(1) { animation-delay: 20ms; } .mk-pag[data-entra] .jlista > :nth-child(2) { animation-delay: 40ms; } .mk-pag[data-entra] .jlista > :nth-child(3) { animation-delay: 55ms; }
.mk-pag[data-entra] .jlista > :nth-child(4) { animation-delay: 75ms; } .mk-pag[data-entra] .jlista > :nth-child(5) { animation-delay: 90ms; } .mk-pag[data-entra] .jlista > :nth-child(6) { animation-delay: 110ms; }
.mk-pag[data-entra] .jlista > :nth-child(7) { animation-delay: 125ms; }
@keyframes jentra { from { transform: translateY(10px); opacity: 0; } }
/* ✕ a la izquierda, el título al centro y ✓ a la derecha en cada hoja, de 44 px: caben con guantes sin quitar lugar (Iker, 17-nov) */
.hbar { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; margin: 0 0 12px; }
.hbar h3 { margin: 0; font-size: 19px; text-align: center; }
.hb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: #c0392b; }
.hb.si { background: var(--boton); color: #fff; }
.hb.ayuda { color: var(--navy); }
.hb svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.hoja .pjs .pj { min-height: 118px; font-size: 15px; } .hoja .pjs .pj .foto { width: 58px; height: 58px; }
.hoja .pjs.chicos .pj { min-height: 104px; }
/* ¿Cuánto avanzó? como la V2 que escogió Iker (17-nov, data/belugas-yardas): + y − grandes y saltos en vez de la regla */
.hoja.cuanto .rg-pmf { grid-template-columns: 80px minmax(0, 1fr) 80px; margin-top: 4px; }
.hoja.cuanto .rg-b { width: 80px; height: 76px; border-radius: 20px; background: #e6eaf0; }
.hoja.cuanto .rg-v { font-size: 76px; line-height: 76px; }
.hoja.cuanto .rg-anuncio { bottom: -12px; }
.rg-saltos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0 6px; }
.rg-saltos button { height: 64px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); font: italic 900 26px/1 var(--disp); color: var(--navy); }
.hoja.cuanto .rg-b:active, .rg-saltos button:active { transform: scale(.97); }
.rg-saltos button small { font: 800 13px/1 Inter; font-style: normal; margin-left: 2px; color: var(--mut); }
/* Inicio: la tarjeta del partido sin balón, centrada */
.heroe.hoy .vs { margin-right: 0; } .heroe.hoy .vs .eq { transform: none; text-align: center; }
.op.rojo { background: #c0392b; color: #fff; }
.mk-corr { text-align: center; font: 800 11.5px/1 Inter; letter-spacing: .08em; text-transform: uppercase; opacity: .9; margin: 2px 0 4px; }
.sinquerer button { background: var(--ink); color: #fff; border-radius: 10px; height: 40px; padding: 0 14px; font: 800 14px/1 Inter; flex: none; }

/* hojas de abajo */
.velo { position: absolute; inset: 0; background: rgba(11,27,51,.38); z-index: 10; animation: ap .15s ease-out; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 10px 16px calc(22px + var(--abajo)); z-index: 11; animation: sube .2s ease-out; max-height: 88%; overflow-y: auto; }
.hoja h3 { font: 800 21px/1.2 Inter; margin: 4px 2px 14px; }
.hoja h3 + p { margin-top: -10px; }
.hoja p { margin: 0 2px 14px; color: var(--mut); font-size: 14px; }
.hoja ul { margin: 0 2px 14px; padding-left: 18px; color: var(--ink); font-size: 14px; }
.hoja li { margin-bottom: 6px; }
.pjs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pj { background: var(--bg); border-radius: 16px; min-height: 104px; display: grid; justify-items: center; align-content: center; gap: 6px; padding: 8px 4px; font: 700 13px/1.1 Inter; min-width: 0; }
.pj .foto { width: 50px; height: 50px; }
.hoja .lados h4.sub { display: flex; align-items: center; gap: 8px; color: var(--ink); } .hoja .lados h4.sub:first-child { margin-top: 2px; }
.lados h4.sub i { width: 4px; height: 16px; border-radius: 2px; background: #8a97a8; } .lados h4.sub.lO i { background: var(--azul); } .lados h4.sub.lD i { background: color-mix(in srgb, var(--rc) 75%, #000); }
/* «¿Quién?»: cada quien con el color de su lado (Iker, 17-nov): Ataque en azul Belugas, Defensa en el color del rival, Los dos sin color; las fotos sin aro de color (Iker, 17-nov) */
.lados .pj.lO { background: linear-gradient(180deg, #eef4fc, #e1ebf8); }
.lados .pj.lD { background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 8%, #fff), color-mix(in srgb, var(--rc) 18%, #fff)); }
.lados .pj .ini { border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--linea); }
.pj .corta { max-width: 100%; }
.pj small { color: var(--mut); font: 600 11px/1 Inter; }
.ops { display: grid; gap: 10px; }
.ops.dos { grid-template-columns: 1fr 1fr; }
.op { height: 64px; border-radius: 16px; background: var(--bg); font: 800 17px/1 Inter; }
.op.prim, .btn-gr { background: var(--boton); color: #fff; }
.op.sec { background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); color: var(--mut); font-weight: 700; }
.ops.fijo { position: sticky; bottom: 0; background: #fff; padding: 10px 0 calc(12px + var(--abajo)); box-shadow: 0 -10px 12px -8px rgba(11,27,51,.08); }
.campo { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-size: 15px; }
.campo .izq { display: flex; align-items: center; gap: 10px; min-width: 0; }
.campo .izq .rlogo { width: 34px; height: 34px; }
.campo .izq .foto { width: 40px; height: 40px; }
.campo span.l { color: var(--mut); font-size: 12.5px; display: block; margin-bottom: 4px; }
.campo b { font-weight: 700; }
.campo u { text-decoration: none; color: var(--acento); font: 700 13.5px/1 Inter; flex: none; }
.lista-van { display: grid; gap: 6px; margin-bottom: 12px; }
.hoja .lista-van h4.sub { margin: 10px 4px 2px; } .hoja .lista-van h4.sub:first-child { margin-top: 0; }
.van-f { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 14px; background: var(--bg); }
.van-f .foto { width: 40px; height: 40px; }
.van-f > div { flex: 1; min-width: 0; }
.van-f b { display: block; font: 700 14.5px/1.2 Inter; }
.van-f small { color: var(--mut); font-size: 12px; }
.van-f .ck { margin-left: auto; width: 28px; height: 28px; flex: none; display: block; background: none; border: 0; box-shadow: none; }
.van-f .ck svg { display: block; width: 28px; height: 28px; }
.op.prim:disabled { opacity: .4; }
.van-f.no { opacity: .55; }

<script>
'use strict';
const LOGO = 'logo.webp', BALON = 'archivos/balon-3d.png', CORONA = 'archivos/corona-3d.png';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } }, lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
// los nombres los escribe la gente: van siempre escapados a la pantalla
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// los 12 de la liga (diseno/archivos/equipos/equipos.json)
const EQUIPOS = [
  ['only-fins', 'ONF', 'Only Fins', '#10a6b3'], ['triple-t', 'TTT', 'Triple T', '#c5353e'], ['bucaneros', 'BUC', 'Bucaneros', '#bd3e44'],
  ['destroyers', 'DES', 'Destroyers', '#3c6f34'], ['kickass', 'KCK', 'Kickass', '#141723'], ['bulldogs', 'BUL', 'Bulldogs', '#714246'],
  ['lobos-its', 'LOB', 'Lobos ITSZ', '#767577'], ['kaffies', 'KAF', 'Kaffies', '#d1a050'], ['ultimos-aztecas', 'AZT', 'Últimos Aztecas', '#d3a45a'],
  ['los-fantasmas', 'FAN', 'Los Fantas', '#3a3a3b'], ['panini', 'PAN', 'Panini', '#dba466'],
];
// tamaño visible de cada logo en su caja (raíz del área pintada y ancho), medido en los PNG de 256:
// en listas se igualan entre ellos; frente al logo de Belugas (marcador y partido) pesan como él
const VISIBLE = {'only-fins': [.659, .910], 'triple-t': [.658, .914], bucaneros: [.698, .922], destroyers: [.743, .922], kickass: [.722, .906], bulldogs: [.613, .906], 'lobos-its': [.643, .910], kaffies: [.645, .910], 'ultimos-aztecas': [.705, .906], 'los-fantasmas': [.616, .934], panini: [.622, .906]};
const escala = (id, meta, tope) => { const [a, w] = VISIBLE[id] || [.66, .91]; return Math.min(meta / a, tope / w).toFixed(3); };
const RIVALES = EQUIPOS.map(([id, corto, largo, color]) => ({id, corto, largo, color, logo: `archivos/equipos/${id}-256.png`, k: escala(id, .66, 1.0), kv: escala(id, .78, 1.1)}));
// mientras no se escoge contra quién (se escoge al empezar a marcar)
const SIN_RIVAL = {id: '', corto: 'Rival', largo: 'Rival', sig: '?', color: '#56647a', logo: null};
const esRival = (id) => RIVALES.some((x) => x.id === id);
const R = (id) => RIVALES.find((x) => x.id === id) || SIN_RIVAL;
let HOY = null; // el rival del partido que se está marcando
let RESULTADOS = [];
let RECORD = '0–0';
function rlogo(r) {
  if (!r.logo) return `<span class="rlogo sin">${r.sig || r.corto}</span>`;
  return `<span class="rlogo" style="--k:${r.k};--kv:${r.kv}"><img src="${r.logo}" alt="${r.largo}" loading="lazy"></span>`;
}

// los botones de Marcar llevan ícono arriba (Iker, 17-nov), en dos juegos para comparar en Ajustes: con color (A, el de
// tablero/app/inicio.html) o minimalista (B, ICONOS_S); la clase f es la parte que se rellena
const ICONOS_C = {

    // en los pasos de tocar solo se puede tocar el hueco
    const tapas = r && p.hecho ? [`left:0;top:0;right:0;height:${r.t}px`, `left:0;top:${r.t + r.h}px;right:0;bottom:0`, `left:0;top:${r.t}px;width:${r.l}px;height:${r.h}px`, `left:${r.l + r.w}px;top:${r.t}px;right:0;height:${r.h}px`].map((s) => `<div class="onb-tapa" style="${s}"></div>`).join('') : '';
    const html = (r ? `<div class="onb-hueco" style="left:${r.l}px;top:${r.t}px;width:${r.w}px;height:${r.h}px;border-radius:${r.rad}px"></div>` : '<div class="onb-velo"></div>') + tapas
      + `<div class="onb-card ${pos}" style="${estilo};--ax:${ax}%">${cuenta}<b>${p.tit}</b><p>${p.txt}</p>${acc}</div>`;
    // si nada cambió no se rehace: la tarjeta no vuelve a aparecer ni el pulso empieza de nuevo cada vez que la app se pinta
    if (html !== ovHtml) ov.innerHTML = ovHtml = html;
  }
  ov.addEventListener('click', (e) => {
    const b = e.target.closest('[data-o]');
    if (b) { e.stopPropagation(); ({ sig: sigue, fin }[b.dataset.o])(); return; }
    if (tour && !PASOS[tour.i].hecho && !e.target.closest('.onb-card')) sigue(); // tocar fuera de la tarjeta = siguiente
  });
  document.addEventListener('keydown', (e) => { if (tour && e.key === 'Escape') fin(); });
  addEventListener('resize', () => pinta());
  // después de cada pintada: el paso de tocar avanza solo en cuanto se hizo
  onbTras = () => {
    if (!tour) return;
    const p = PASOS[tour.i];
    if (p.hecho && st.partido && p.hecho()) return sigue();
    requestAnimationFrame(pinta);
  };
  A.ayuda = () => { st.hoja = 'ayuda'; };
  A.tour = () => empieza();
  window.onb = { empieza, fin, sigue, get T() { return tour; }, get paso() { return tour && PASOS[tour.i]; } };
  if (!visto()) setTimeout(() => { if (st.pant === 'inicio' && !st.hoja) empieza(); }, 1300);
})();
// ---------- al abrir: lo guardado en el teléfono primero (sirve sin señal), luego la nube ----------
cargaLocal(); recalcular(); if (st.partido) rehacer(st.partido); cierraViejo();
pintar();
sinc(filas.temp); sinc(filas.vivo); revisarVersion();
// pedir al navegador que no borre los datos de la app
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { /* no hay */ }
// abrir sin señal (solo en la dirección publicada; en la Mac no, para ver los cambios al momento)
if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
